<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance — Remastered</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app-wrapper">
        <header class="main-header">
            <div class="status-dot"></div>
            <h1>RESONANCE <span class="version">v2.0</span></h1>
            <p>Always on Touch | 2026</p>
        </header>

        <div id="messages"></div>

        <div class="ui-panel">
            <div class="input-row">
                <input type="text" id="username" placeholder="Name" class="glass-input small-input">
                <input type="text" id="messageInput" placeholder="Message..." class="glass-input">
                <button id="sendBtn" class="action-btn">↑</button>
            </div>
        </div>
    </div>

    <script>
        // ТВОИ КЛЮЧИ (Оставь те, что вставляла раньше)
        const firebaseConfig = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            authDomain: "resonance-chat-5495.firebaseapp.com",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com",
            projectId: "resonance-chat-5495",
            storageBucket: "resonance-chat-5495.appspot.com",
            messagingSenderId: "909712050521",
            appId: "1:909712050521:web:your_app_id"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // СЕКРЕТНЫЙ ПАРОЛЬ АДМИНА (измени на свой)
        const ADMIN_PASS = "1234"; 
        let isAdmin = false;

        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('messageInput');
        const userField = document.getElementById('username');

        // Проверка ника
        userField.onblur = () => {
            if (userField.value === "Workstation5495") {
                let pass = prompt("Confirm Admin Identity (Password):");
                if (pass === ADMIN_PASS) {
                    isAdmin = true;
                    alert("Welcome back, Master.");
                } else {
                    alert("Access Denied. Nickname protected.");
                    userField.value = "Guest_" + Math.floor(Math.random()*100);
                }
            }
        };

        function sendMessage() {
            const text = msgInput.value;
            if (text.trim() !== "") {
                db.ref("global_chat").push({
                    name: userField.value || "Guest",
                    text: text,
                    admin: isAdmin,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });
                msgInput.value = "";
            }
        }

        sendBtn.onclick = sendMessage;
        msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage() };

        db.ref("global_chat").on("child_added", (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            const msgBox = document.createElement("div");
            
            // Стиль сообщения (Админ или Обычный)
            msgBox.className = data.admin ? "msg admin-msg" : "msg user-msg";
            
            let deleteBtn = isAdmin ? `<span class="del" onclick="deleteMsg('${key}')">×</span>` : "";
            
            msgBox.innerHTML = `
                <div class="msg-content">
                    <span class="sender">${data.name} ${deleteBtn}</span>
                    <p>${data.text}</p>
                    <span class="time">${data.time}</span>
                </div>
            `;
            document.getElementById('messages').appendChild(msgBox);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });

        // Функция удаления (только для тебя)
        window.deleteMsg = (key) => {
            if (isAdmin && confirm("Delete this message?")) {
                db.ref("global_chat").child(key).remove();
                location.reload(); // Быстрая очистка экрана
            }
        };
    </script>
</body>
</html>
