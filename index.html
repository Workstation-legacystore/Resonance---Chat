<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #111; --card: #0a0a0a; --text: #fff; --text-dim: #666; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; --accent: #fff; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 90vh; border: var(--border); border-radius: 28px; box-shadow: 0 40px 80px rgba(0,0,0,0.8); } }

        /* --- FRIENDS MODAL --- */
        #friends-modal {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 50; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        #friends-modal.active { opacity: 1; pointer-events: all; }
        
        .modal-card {
            width: 85%; max-width: 320px; background: #111; border: 1px solid #333;
            border-radius: 24px; padding: 20px; box-shadow: 0 20px 50px #000;
            transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #friends-modal.active .modal-card { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-family: 'Outfit'; font-size: 18px; font-weight: 700; margin: 0; }
        .close-modal { background: none; border: none; color: #666; font-size: 24px; cursor: pointer; line-height: 1; }
        
        .add-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .add-btn { background: #fff; color: #000; border: none; border-radius: 12px; width: 40px; font-weight: bold; cursor: pointer; }
        
        #friends-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .friend-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #1a1a1a; padding: 10px 15px; border-radius: 12px; font-size: 14px; 
        }
        .friend-del { color: var(--danger); background: none; border: none; font-size: 10px; font-weight: bold; cursor: pointer; opacity: 0.7; }

        /* --- AUTH --- */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 40px; transition: 0.8s; }
        .brand-logo { font-family: 'Outfit', sans-serif; font-size: 42px; font-weight: 800; }
        .brand-sub { font-size: 10px; color: var(--text-dim); margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase; }
        
        .input-std { background: #161616; border: 1px solid #222; color: white; padding: 18px; border-radius: 16px; font-size: 16px; margin-bottom: 15px; width: 100%; }
        .btn-main { background: white; color: black; border: none; padding: 18px; border-radius: 16px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; width: 100%; }

        /* --- MAIN --- */
        header { padding: 15px 20px; background: rgba(10,10,10,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 5px; }
        
        #feed { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: popIn 0.3s; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 12px 16px; font-size: 15px; line-height: 1.4; overflow-wrap: break-word; }
        .msg-wrap.mine .bubble { background: #fff; color: #000; border-radius: 20px 20px 4px 20px; }
        .msg-wrap:not(.mine) .bubble { background: #1a1a1a; color: #fff; border-radius: 20px 20px 20px 4px; }
        .meta { font-size: 10px; color: #666; margin-bottom: 4px; padding: 0 8px; }

        .footer { padding: 15px; border-top: 1px solid #1a1a1a; background: #0a0a0a; display: flex; gap: 10px; }
        .input-msg { flex: 1; background: #161616; border: 1px solid #222; padding: 12px 20px; border-radius: 25px; color: white; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="app-core">
        
        <div id="friends-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <h2 class="modal-title">Friends List</h2>
                    <button class="close-modal" onclick="Core.toggleFriends()">×</button>
                </div>
                <div class="add-row">
                    <input type="text" id="friend-input" class="input-std" placeholder="Nickname..." style="margin:0; padding: 12px;">
                    <button class="add-btn" onclick="Core.addFriend()">+</button>
                </div>
                <div id="friends-list">
                    </div>
            </div>
        </div>

        <div id="auth-gate">
            <div class="brand-logo">RESONANCE</div>
            <div class="brand-sub">v1.2.0 SECURE</div>
            <input type="text" id="nick-field" class="input-std" placeholder="Nickname (3-15 chars)" maxlength="15">
            <input type="password" id="pass-field" class="input-std" placeholder="Admin Token" style="display:none">
            <button class="btn-main" onclick="Core.login()">ENTER</button>
        </div>
        
        <header>
            <button class="icon-btn" onclick="Core.toggleFriends()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </button>
            <div class="header-title" style="font-weight: 800; letter-spacing: -1px;">RESONANCE</div>
            <div class="status-led" style="width:8px; height:8px; background:#32d74b; border-radius:50%;"></div>
        </header>

        <div id="feed"></div>

        <div class="footer">
            <input type="text" id="msg-input" class="input-msg" placeholder="Message..." autocomplete="off">
            <button class="send-btn" onclick="Core.send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiKey: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk",
            databaseURL: "https://resonance---chat-default-rtdb.firebaseio.com",
            projectId: "resonance---chat",
            admin: "Workstation5495",
            hash: "UlRXNTQ5NUpFTExZQkVBTg=="
        };

        const Core = {
            db: null, user: null, isRoot: false, friends: [],
            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();
                
                // Load Friends
                const f = localStorage.getItem('res_friends_v2');
                if (f) this.friends = JSON.parse(f);

                // Auto Login check
                const s = localStorage.getItem('res_core_user');
                if (s) { this.user = s; this.isRoot = localStorage.getItem('res_core_root') === 'true'; this.open(); }
                
                document.getElementById('nick-field').oninput = (e) => { 
                    document.getElementById('pass-field').style.display = (e.target.value === CONFIG.admin) ? 'block' : 'none'; 
                };
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },
            
            // --- VALIDATION LOGIC ---
            validateNick(nick) {
                // 1. Length check (3 to 15)
                if (nick.length < 3 || nick.length > 15) return "Nickname must be 3-15 characters.";
                // 2. Invisible/Space check
                if (!/^[A-Za-z0-9_]+$/.test(nick)) return "Only letters, numbers and _ allowed.";
                return null;
            },

            login() {
                const n = document.getElementById('nick-field').value.trim();
                
                // Security Check
                const error = this.validateNick(n);
                if (error) return alert("SECURITY ALERT:\n" + error);

                // Admin Auth
                if (n === CONFIG.admin) {
                    if (btoa(document.getElementById('pass-field').value) === CONFIG.hash) { 
                        this.isRoot = true; localStorage.setItem('res_core_root', 'true'); 
                    } else return alert("ACCESS DENIED");
                }
                
                this.user = n; localStorage.setItem('res_core_user', n); this.open();
            },
            
            open() { document.getElementById('auth-gate').style.transform = "translateY(-100%)"; this.sync(); },
            
            // --- FRIENDS LOGIC ---
            toggleFriends() {
                const el = document.getElementById('friends-modal');
                el.classList.toggle('active');
                if (el.classList.contains('active')) this.renderFriends();
            },
            addFriend() {
                const nick = document.getElementById('friend-input').value.trim();
                if (!nick) return;
                if (!this.friends.includes(nick)) {
                    this.friends.push(nick);
                    localStorage.setItem('res_friends_v2', JSON.stringify(this.friends));
                    this.renderFriends();
                }
                document.getElementById('friend-input').value = "";
            },
            removeFriend(nick) {
                if(confirm("Remove " + nick + "?")) {
                    this.friends = this.friends.filter(f => f !== nick);
                    localStorage.setItem('res_friends_v2', JSON.stringify(this.friends));
                    this.renderFriends();
                }
            },
            renderFriends() {
                const list = document.getElementById('friends-list');
                list.innerHTML = "";
                if (this.friends.length === 0) list.innerHTML = "<div style='color:#444; text-align:center; font-size:12px;'>No friends yet</div>";
                
                this.friends.forEach(f => {
                    list.innerHTML += `
                        <div class="friend-item">
                            <span>${f}</span>
                            <button class="friend-del" onclick="Core.removeFriend('${f}')">REMOVE</button>
                        </div>`;
                });
            },

            // --- CHAT LOGIC ---
            send() {
                const i = document.getElementById('msg-input');
                const t = i.value.trim();
                if (!t) return;
                this.db.ref("chat").push({ u: this.user, t: t, r: this.isRoot, ts: Date.now() });
                i.value = "";
            },
            sync() {
                this.db.ref("chat").limitToLast(50).on("child_added", (s) => {
                    const d = s.val(); const f = document.getElementById('feed');
                    const r = document.createElement('div');
                    r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                    
                    // Simple Delete for Admin
                    const del = this.isRoot ? `<span style="color:#ff453a; cursor:pointer; font-weight:bold; margin-left:5px;" onclick="Core.drop('${s.key}')">×</span>` : '';

                    r.innerHTML = `
                        <div class="meta">${d.u} ${del}</div>
                        <div class="bubble">${d.t.replace(/</g, "&lt;")}</div>
                    `;
                    f.appendChild(r); f.scrollTop = f.scrollHeight;
                });
                this.db.ref("chat").on("child_removed", (s) => { 
                    const el = document.getElementById(s.key); /* Bug fix: ID wasn't set in prev loop */
                    if(el) el.remove(); 
                    // Fallback reload if ID missing
                    else f.innerHTML = ""; 
                });
            },
            drop(k) { if(confirm("Del?")) this.db.ref("chat").child(k).remove(); }
        };
        Core.init();
    </script>
</body>
</html>
