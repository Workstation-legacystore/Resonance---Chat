<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE / UNIT-5495</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0b;
            --accent: #ffffff;
            --secondary: #1a1a1c;
            --border: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0; height: 100vh;
            background: var(--bg);
            color: var(--accent);
            font-family: var(--font-main);
            display: flex; justify-content: center; align-items: center;
        }

        /* Фоновый эффект: тонкая сетка как в чертежах */
        body::before {
            content: ""; position: absolute; width: 100%; height: 100%;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 32px 32px; z-index: -1; opacity: 0.5;
        }

        #app {
            width: 100%; max-width: 500px; height: 90vh;
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            background: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(40px);
        }

        /* ЭКРАН ВХОДА */
        #login-gate {
            position: absolute; inset: 0; background: var(--bg);
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; padding: 40px;
            transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .unit-label { font-family: var(--font-code); font-size: 10px; letter-spacing: 4px; opacity: 0.4; margin-bottom: 8px; }
        .gate-title { font-size: 32px; font-weight: 300; letter-spacing: -1px; margin-bottom: 40px; }

        .prime-input {
            background: transparent; border: none;
            border-bottom: 1px solid var(--border);
            color: white; font-family: var(--font-code);
            padding: 12px 0; font-size: 16px; width: 100%;
            margin-bottom: 20px; transition: 0.3s;
        }

        .prime-input:focus { border-color: white; }

        .prime-btn {
            background: white; color: black; border: none;
            padding: 15px; font-weight: 500; font-size: 12px;
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; margin-top: 10px;
        }

        /* ИНТЕРФЕЙС ЧАТА */
        header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: baseline;
        }

        #messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .msg { max-width: 90%; animation: fadeIn 0.4s ease; }
        .msg.mine { align-self: flex-end; text-align: right; }

        .sender { font-family: var(--font-code); font-size: 9px; opacity: 0.4; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .text { font-size: 14px; font-weight: 300; line-height: 1.6; }

        /* Стиль админа - тонкое подчеркивание вместо неона */
        .msg.admin .text { border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; }

        .input-box {
            padding: 20px; border-top: 1px solid var(--border);
            display: flex; gap: 15px;
        }

        .del-link { font-family: var(--font-code); font-size: 9px; color: #ff4444; cursor: pointer; margin-left: 10px; text-decoration: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app">
        <div id="login-gate">
            <div class="unit-label">SYSTEM IDENTIFICATION</div>
            <div class="gate-title">Resonance</div>
            
            <input type="text" id="nick" class="prime-input" placeholder="USERNAME" autocomplete="off">
            <input type="password" id="pass" class="prime-input" placeholder="ROOT_KEY" style="display:none">
            
            <button class="prime-btn" onclick="Core.auth()">Connect</button>
        </div>

        <header>
            <span style="font-weight: 500; font-size: 14px;">UNIT-5495</span>
            <span id="user-info" style="font-family: var(--font-code); font-size: 10px; opacity: 0.5;">DISCONNECTED</span>
        </header>

        <div id="messages"></div>

        <div class="input-box">
            <input type="text" id="msg-input" class="prime-input" style="margin:0; font-size: 13px;" placeholder="Input signal...">
            <button onclick="Core.send()" class="prime-btn" style="padding: 0 20px; margin: 0;">&rarr;</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com",
            projectId: "resonance-chat-5495",
            admin: "Workstation5495",
            pass: "5495" // <--- ТВОЙ ПАРОЛЬ ТУТ
        };

        const Core = {
            user: "", isAdmin: false,

            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();
                
                document.getElementById('nick').oninput = (e) => {
                    document.getElementById('pass').style.display = (e.target.value === CONFIG.admin) ? "block" : "none";
                };
            },

            auth() {
                const n = document.getElementById('nick').value.trim();
                if(!n) return;

                if(n === CONFIG.admin) {
                    if(document.getElementById('pass').value === CONFIG.pass) {
                        this.isAdmin = true;
                    } else {
                        return alert("ACCESS DENIED");
                    }
                }
                
                this.user = n;
                document.getElementById('login-gate').style.transform = "translateX(-100%)";
                document.getElementById('user-info').innerText = this.isAdmin ? "STATUS: ROOT" : `USER: ${this.user.toUpperCase()}`;
                this.listen();
            },

            send() {
                const text = document.getElementById('msg-input').value;
                if(!text.trim()) return;
                this.db.ref("global_chat").push({
                    u: this.user,
                    t: text,
                    a: this.isAdmin,
                    ts: Date.now()
                });
                document.getElementById('msg-input').value = "";
            },

            listen() {
                this.db.ref("global_chat").limitToLast(100).on("child_added", (snap) => {
                    const d = snap.val();
                    const k = snap.key;
                    const isMe = d.u === this.user;
                    
                    const el = document.createElement('div');
                    el.className = `msg ${isMe ? 'mine' : ''} ${d.a ? 'admin' : ''}`;
                    el.id = k;
                    
                    let del = (this.isAdmin) ? `<a class="del-link" onclick="Core.drop('${k}')">DROP</a>` : "";

                    el.innerHTML = `
                        <span class="sender">${d.u} ${del}</span>
                        <div class="text">${d.t}</div>
                    `;
                    document.getElementById('messages').appendChild(el);
                    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                });

                this.db.ref("global_chat").on("child_removed", (snap) => {
                    const el = document.getElementById(snap.key);
                    if(el) el.remove();
                });
            },

            drop(k) { if(confirm("DELETE?")) this.db.ref("global_chat").child(k).remove(); }
        };

        Core.init();
    </script>
</body>
</html>
