<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; --success: #32d74b; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { height: 100dvh; background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; display: none; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 95vh; border: var(--border); border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); } }

        /* AUTH GATE */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .auth-step { display: none; width: 100%; }
        .auth-step.active { display: block !important; }
        .auth-inp { background: #111; border: 1px solid #222; color: #fff; padding: 20px; border-radius: 16px; margin-bottom: 12px; width: 100%; text-align: center; font-size: 16px; }
        .auth-btn { background: #fff; color: #000; border: none; padding: 20px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; }

        /* UI */
        header { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #161616; background: rgba(10,10,10,0.98); }
        #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; background: #080808; border-right: 1px solid #222; z-index: 500; transform: translateX(-100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 30px; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); box-shadow: 100px 0 200px rgba(0,0,0,0.9); }
        
        /* FOUNDER GLOW */
        .founder-badge { 
            background: linear-gradient(90deg, #ff453a, #ff9f0a); color: #fff; padding: 2px 6px; 
            border-radius: 4px; font-size: 8px; font-weight: 900; 
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.4); 
            animation: pulseGlow 2s infinite; 
        }
        @keyframes pulseGlow { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 20px rgba(255, 69, 58, 0.6); } 100% { opacity: 0.8; } }

        #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 14px 18px; font-size: 15px; border-radius: 22px; background: #1a1a1a; line-height: 1.4; }
        .mine .bubble { background: #fff; color: #000; }

        .footer { height: 80px; padding: 0 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #161616; background: #0a0a0a; }
        .msg-input { flex: 1; background: #111; border: 1px solid #222; padding: 0 20px; border-radius: 25px; color: #fff; height: 50px; }
        .send-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .logout-btn { margin-top: auto; background: rgba(255, 69, 58, 0.1); color: var(--danger); border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        ::-webkit-scrollbar { width: 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="auth-gate">
        <h1 style="font-family:'Outfit'; font-size:42px; text-align:center; margin-bottom:40px;">RESONANCE</h1>
        <div id="st-1" class="auth-step active">
            <input type="text" id="n-f" class="auth-inp" placeholder="Identity Name">
            <button onclick="Auth.check()" class="auth-btn">VERIFY</button>
        </div>
        <div id="st-l" class="auth-step">
            <input type="password" id="l-p" class="auth-inp" placeholder="Password">
            <button onclick="Auth.login()" class="auth-btn">LINK</button>
        </div>
        <div id="st-r" class="auth-step">
            <input type="password" id="r-p" class="auth-inp" placeholder="Create Pass">
            <button onclick="Auth.reg()" class="auth-btn">INITIALIZE</button>
        </div>
    </div>

    <div id="app-core">
        <div id="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;"><div style="font-family:'Outfit'; font-size:24px; font-weight:800;">MENU</div><button onclick="Core.toggleMenu()" style="background:none; border:none; color:#666; font-size:28px;">&times;</button></div>
            <div id="admin-zone" style="display:none; padding:15px; border:1px solid var(--danger); border-radius:16px; background:rgba(255,69,58,0.05); margin-bottom: 20px;"><div id="ban-list"></div></div>
            <button onclick="Core.logout()" class="logout-btn">DISCONNECT</button>
        </div>
        <header>
            <button onclick="Core.toggleMenu()" style="background:none; border:none; color:#fff; cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
            <div style="font-family:'Outfit'; font-weight:800; font-size:20px;">RESONANCE</div>
            <div style="width:8px; height:8px; background:#32d74b; border-radius:50%;"></div>
        </header>
        <div id="feed"></div>
        <div class="footer">
            <input type="text" id="msg-input" class="msg-input" placeholder="Broadcast...">
            <button onclick="Core.send()" class="send-btn">▲</button>
        </div>
    </div>

    <script>
        const CFG = { k: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk", d: "https://resonance---chat-default-rtdb.firebaseio.com", a: "Workstation5495", h: "UlRXNTQ5NUpFTExZQkVBTg==" };
        const Auth = {
            nick: null,
            init() { 
                firebase.initializeApp({apiKey: CFG.k, databaseURL: CFG.d}); 
                const u = localStorage.getItem('res_user');
                // АВТОЛОГИН: ЕСЛИ ЕСТЬ ДАННЫЕ В ПАМЯТИ - ВХОДИМ СРАЗУ
                if(u) {
                    this.fin(u, localStorage.getItem('res_root') === 'true');
                }
            },
            check() {
                const n = document.getElementById('n-f').value.trim(); if (!n) return;
                this.nick = n;
                firebase.database().ref('users/'+n).once('value', s => {
                    document.querySelectorAll('.auth-step').forEach(e => e.classList.remove('active'));
                    if (s.exists()) document.getElementById('st-l').classList.add('active');
                    else document.getElementById('st-r').classList.add('active');
                });
            },
            login() {
                const p = document.getElementById('l-p').value;
                if (this.nick === CFG.a && btoa(p) === CFG.h) return this.fin(this.nick, true);
                firebase.database().ref('users/'+this.nick).once('value', s => {
                    if (s.val() && s.val().pass === btoa(p)) this.fin(this.nick, false); else alert("WRONG");
                });
            },
            reg() {
                const p = document.getElementById('r-p').value; if (p.length<4) return;
                firebase.database().ref('users/'+this.nick).set({ pass: btoa(p) }).then(() => this.fin(this.nick, false));
            },
            fin(n, r) {
                localStorage.setItem('res_user', n); localStorage.setItem('res_root', r);
                Core.user = n; Core.isRoot = r;
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app-core').style.display = 'flex';
                Core.start();
            }
        };
        const Core = {
            start() {
                this.db = firebase.database();
                this.db.ref("chat").limitToLast(50).on("child_added", s => {
                    const d = s.val(); const f = document.getElementById('feed'); const r = document.createElement('div');
                    r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                    let b = d.r ? `<span class="founder-badge">FOUNDER</span>` : "";
                    r.innerHTML = `<div style="font-size:10px; color:#555; margin-bottom:4px;">${b} ${d.u}</div><div class="bubble">${d.t}</div>`;
                    f.appendChild(r); f.scrollTop = f.scrollHeight;
                });
                firebase.database().ref("banned/"+this.user).on('value', s => { if(s.exists()) this.logout(); });
                if(this.isRoot) document.getElementById('admin-zone').style.display='block';
            },
            send() {
                let t = document.getElementById('msg-input').value.trim(); if(!t) return;
                this.db.ref("chat").push({ u: this.user, t: t, r: this.isRoot });
                document.getElementById('msg-input').value = "";
            },
            toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); },
            logout() { localStorage.clear(); location.reload(); }
        };
        Auth.init();
    </script>
</body>
</html>
