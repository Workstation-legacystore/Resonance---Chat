<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --text-dim: #666; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 90vh; border: var(--border); border-radius: 28px; } }

        /* HEADER & FOOTER - PERFECT SYMMETRY */
        header, .footer { 
            height: 70px; padding: 0 20px; 
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(10,10,10,0.95); z-index: 10;
        }
        header { border-bottom: 1px solid #1a1a1a; backdrop-filter: blur(20px); }
        .footer { border-top: 1px solid #1a1a1a; background: #0a0a0a; gap: 12px; }

        /* BUTTONS STYLING */
        .icon-btn { 
            width: 40px; height: 40px; display: flex; 
            align-items: center; justify-content: center; 
            background: none; border: none; color: #fff; cursor: pointer;
        }
        .send-btn { 
            width: 44px; height: 44px; border-radius: 50%; 
            background: #fff; color: #000; border: none; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        /* SIDEBAR */
        #sidebar { 
            position: absolute; left: -280px; top: 0; bottom: 0; width: 280px; 
            background: #050505; border-right: var(--border); z-index: 60; 
            transition: 0.4s cubic-bezier(0.8, 0, 0.2, 1); padding: 25px; 
            display: flex; flex-direction: column; 
        }
        #sidebar.open { left: 0; box-shadow: 20px 0 50px #000; }

        /* CHAT FEED */
        #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 80%; animation: popIn 0.3s ease; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 12px 18px; font-size: 15px; border-radius: 22px; line-height: 1.4; }
        .msg-wrap.mine .bubble { background: #fff; color: #000; border-radius: 22px 22px 4px 22px; }
        .msg-wrap:not(.mine) .bubble { background: #1a1a1a; color: #fff; border-radius: 22px 22px 22px 4px; }

        /* AUTH & MODALS */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .input-std { background: #111; border: 1px solid #222; color: white; padding: 18px; border-radius: 16px; margin-bottom: 12px; width: 100%; }
        .input-msg { flex: 1; background: #161616; border: 1px solid #222; padding: 12px 20px; border-radius: 25px; color: white; height: 44px; }

        #request-popup { 
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
            width: 90%; background: #fff; color: #000; padding: 12px 20px; 
            border-radius: 20px; z-index: 100; display: none; align-items: center; justify-content: space-between;
        }
        #request-popup.active { display: flex; animation: popIn 0.3s forwards; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="app-core">
        <div id="request-popup">
            <span id="req-text" style="font-size: 13px; font-weight: 600;">Request...</span>
            <button onclick="Core.acceptFriend()" style="background:#000; color:#fff; border:none; padding:8px 15px; border-radius:12px; font-size:11px; font-weight:800;">CONFIRM</button>
        </div>

        <div id="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <div style="font-family:'Outfit'; font-size:20px; font-weight:800;">NETWORK</div>
                <button onclick="Core.toggleMenu()" class="icon-btn" style="font-size:24px;">×</button>
            </div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="f-input" class="input-msg" style="font-size:12px;" placeholder="Add Friend">
                <button onclick="Core.requestFriend()" class="send-btn" style="width:40px; height:40px;">+</button>
            </div>
            <div id="f-list" style="flex:1; margin-top:20px; overflow-y:auto;"></div>
            <button onclick="Core.logout()" style="background:rgba(255,69,58,0.1); color:var(--danger); border:none; padding:15px; border-radius:14px; font-weight:800; cursor:pointer;">EXIT SYSTEM</button>
        </div>

        <div id="auth-gate">
            <h1 style="font-family:'Outfit'; font-size:42px; margin:0; letter-spacing:-2px; text-align:center;">RESONANCE</h1>
            <p style="color:#333; letter-spacing:3px; font-size:10px; margin-bottom:40px; text-transform:uppercase; text-align:center;">Authority v1.2.4</p>
            <input type="text" id="nick-field" class="input-std" placeholder="Identity Nickname">
            <input type="password" id="pass-field" class="input-std" placeholder="Admin Token" style="display:none">
            <button onclick="Core.login()" style="background:#fff; color:#000; border:none; padding:18px; border-radius:16px; font-weight:800; width:100%;">INITIALIZE</button>
        </div>

        <header>
            <button class="icon-btn" onclick="Core.toggleMenu()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div style="font-family:'Outfit'; font-weight:800; letter-spacing:-0.5px; font-size:18px;">RESONANCE</div>
            <div style="width:40px; height:40px; display:flex; align-items:center; justify-content:center;">
                <div style="width:8px; height:8px; background:#32d74b; border-radius:50%; box-shadow:0 0 10px #32d74b;"></div>
            </div>
        </header>

        <div id="feed"></div>

        <div class="footer">
            <input type="text" id="msg-input" class="input-msg" placeholder="Write message..." autocomplete="off">
            <button onclick="Core.send()" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiKey: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk",
            databaseURL: "https://resonance---chat-default-rtdb.firebaseio.com",
            projectId: "resonance---chat",
            admin: "Workstation5495",
            hash: "UlRXNTQ5NUpFTExZQkVBTg=="
        };

        const BAD_WORDS = ["fuck", "bitch", "dick", "cunt", "bastard", "БЛЯДЬ", "ЕБАТЬ", "ПИЗДА", "ХУЙ", "ЗАЕБАЛ", "EБАЛ"];

        const Core = {
            db: null, user: null, isRoot: false, friends: [], pendingFriend: null,
            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();
                this.friends = JSON.parse(localStorage.getItem('res_friends_v2') || "[]");
                const s = localStorage.getItem('res_core_user');
                if (s) { this.user = s; this.isRoot = localStorage.getItem('res_core_root') === 'true'; this.open(); }
                document.getElementById('nick-field').oninput = (e) => { 
                    document.getElementById('pass-field').style.display = (e.target.value === CONFIG.admin) ? 'block' : 'none'; 
                };
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },
            login() {
                const n = document.getElementById('nick-field').value.trim();
                if (n.length < 3 || !/^[A-Za-z0-9_]+$/.test(n)) return alert("Invalid Nickname");
                if (n === CONFIG.admin) {
                    if (btoa(document.getElementById('pass-field').value) === CONFIG.hash) { 
                        this.isRoot = true; localStorage.setItem('res_core_root', 'true'); 
                    } else return alert("Denied");
                }
                this.user = n; localStorage.setItem('res_core_user', n); this.open();
            },
            open() { document.getElementById('auth-gate').style.display = "none"; this.sync(); this.renderFriends(); },
            toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); },
            logout() { if(confirm("Logout?")) { localStorage.clear(); location.reload(); } },
            requestFriend() {
                const target = document.getElementById('f-input').value.trim();
                if (!target || target === this.user) return;
                this.db.ref("chat").push({ u: "SYSTEM", t: `Request: @${this.user} -> @${target}`, type: "req", from: this.user, to: target });
                document.getElementById('f-input').value = ""; this.toggleMenu();
            },
            acceptFriend() {
                if (this.pendingFriend && !this.friends.includes(this.pendingFriend)) {
                    this.friends.push(this.pendingFriend);
                    localStorage.setItem('res_friends_v2', JSON.stringify(this.friends));
                    this.renderFriends();
                }
                document.getElementById('request-popup').classList.remove('active');
            },
            renderFriends() {
                const l = document.getElementById('f-list'); l.innerHTML = "";
                this.friends.forEach(f => {
                    l.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:12px; border-radius:14px; margin-bottom:8px; border:1px solid #222;">
                        <div style="display:flex; align-items:center;"><div style="width:8px; height:8px; background:#32d74b; border-radius:50%; margin-right:10px;"></div>${f}</div>
                        <span onclick="Core.removeFriend('${f}')" style="color:red; cursor:pointer; font-weight:800; font-size:10px;">DEL</span>
                    </div>`;
                });
            },
            removeFriend(n) { this.friends = this.friends.filter(f => f !== n); localStorage.setItem('res_friends_v2', JSON.stringify(this.friends)); this.renderFriends(); },
            send() {
                const i = document.getElementById('msg-input');
                let t = i.value.trim(); if (!t) return;
                BAD_WORDS.forEach(w => { t = t.replace(new RegExp(w, "gi"), "***"); });
                this.db.ref("chat").push({ u: this.user, t: t, r: this.isRoot, ts: Date.now() });
                i.value = "";
            },
            sync() {
                this.db.ref("chat").limitToLast(40).on("child_added", (s) => {
                    const d = s.val();
                    if (d.type === "req" && d.to === this.user) {
                        this.pendingFriend = d.from;
                        document.getElementById('req-text').innerText = `@${d.from} wants to be friends!`;
                        document.getElementById('request-popup').classList.add('active');
                        setTimeout(() => document.getElementById('request-popup').classList.remove('active'), 10000);
                    }
                    if (d.type !== "req") {
                        const f = document.getElementById('feed');
                        const r = document.createElement('div'); r.id = s.key;
                        r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                        r.innerHTML = `<div class="meta">${d.u} ${this.isRoot ? `<span onclick="Core.drop('${s.key}')" style="color:red; cursor:pointer;">DEL</span>` : ''}</div><div class="bubble">${d.t}</div>`;
                        f.appendChild(r); f.scrollTop = f.scrollHeight;
                    }
                });
                this.db.ref("chat").on("child_removed", (s) => document.getElementById(s.key)?.remove());
            },
            drop(k) { if(confirm("Del?")) this.db.ref("chat").child(k).remove(); }
        };
        Core.init();
    </script>
</body>
</html>
