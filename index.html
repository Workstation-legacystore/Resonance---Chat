<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE / UNIT-5495</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #080808;
            --accent: #ffffff;
            --meta: #555555;
            --border: rgba(255, 255, 255, 0.07);
            --font-ui: 'Inter', sans-serif;
            --font-data: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; height: 100vh;
            background: var(--bg);
            color: var(--accent);
            font-family: var(--font-ui);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Инженерная сетка на фоне */
        body::before {
            content: ""; position: absolute; inset: 0;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px; z-index: -1;
        }

        #app-container {
            width: 100%; max-width: 500px; height: 95vh;
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            background: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(20px);
            position: relative;
        }

        /* --- ЭКРАН ВХОДА --- */
        #gate {
            position: absolute; inset: 0; background: var(--bg);
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; padding: 50px;
            transition: transform 0.7s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .label { font-family: var(--font-data); font-size: 9px; letter-spacing: 5px; color: var(--meta); margin-bottom: 10px; }
        .title { font-size: 32px; font-weight: 300; letter-spacing: -1px; margin-bottom: 50px; }

        .input-line {
            background: transparent; border: none;
            border-bottom: 1px solid var(--border);
            color: white; font-family: var(--font-data);
            padding: 15px 0; font-size: 14px; width: 100%;
            margin-bottom: 25px; transition: 0.3s;
        }

        .input-line:focus { border-color: white; }

        .action-btn {
            background: white; color: black; border: none;
            padding: 18px; font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { opacity: 0.8; }

        /* --- ИНТЕРФЕЙС ЧАТА --- */
        header {
            padding: 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #feed {
            flex: 1; overflow-y: auto; padding: 25px;
            display: flex; flex-direction: column; gap: 25px;
        }

        .packet { max-width: 100%; animation: slideIn 0.4s ease forwards; }
        .packet.my-signal { border-right: 1px solid rgba(255,255,255,0.1); padding-right: 15px; align-self: flex-end; text-align: right; }
        
        .u-name { font-family: var(--font-data); font-size: 9px; color: var(--meta); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .u-text { font-size: 14px; font-weight: 300; line-height: 1.6; letter-spacing: 0.2px; }

        /* ROOT (ADMIN) STYLE */
        .packet.root-privilege .u-text { 
            color: #fff; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03));
            border-left: 1px solid white;
            padding-left: 10px;
        }

        .footer-input {
            padding: 25px; border-top: 1px solid var(--border);
            display: flex; gap: 20px;
        }

        .drop-cmd { font-family: var(--font-data); font-size: 9px; color: #cc0000; cursor: pointer; margin-left: 10px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Скроллбар */
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app-container">
        <div id="gate">
            <div class="label">SECURE CONNECTION</div>
            <div class="title">Resonance</div>
            
            <input type="text" id="id-input" class="input-line" placeholder="IDENTIFIER" autocomplete="off">
            <input type="password" id="key-input" class="input-line" placeholder="ROOT_TOKEN" style="display:none">
            
            <button class="action-btn" onclick="Core.connect()">Initialize</button>
        </div>

        <header>
            <span style="font-weight: 600; font-size: 13px; letter-spacing: 1px;">UNIT-5495</span>
            <span id="sys-info" style="font-family: var(--font-data); font-size: 9px; color: var(--meta);">OFFLINE</span>
        </header>

        <div id="feed"></div>

        <div class="footer-input">
            <input type="text" id="raw-input" class="input-line" style="margin:0; font-size: 13px;" placeholder="Message string...">
            <button onclick="Core.broadcast()" class="action-btn" style="padding: 0 25px; margin: 0;">&rarr;</button>
        </div>
    </div>

    <script>
        /**
         * RESONANCE INDUSTRIAL CORE
         * USER: Katya (Workstation5495)
         */

        const CFG = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com",
            projectId: "resonance-chat-5495",
            master: "Workstation5495",
            token: "5495" // <--- ТВОЙ ПАРОЛЬ ТУТ
        };

        const Core = {
            user: "", isRoot: false,

            init() {
                firebase.initializeApp(CFG);
                this.db = firebase.database();
                
                document.getElementById('id-input').oninput = (e) => {
                    const isMaster = (e.target.value === CFG.master);
                    document.getElementById('key-input').style.display = isMaster ? "block" : "none";
                };

                document.getElementById('raw-input').onkeypress = (e) => { if(e.key === 'Enter') this.broadcast(); };
            },

            connect() {
                const nick = document.getElementById('id-input').value.trim();
                if(!nick) return;

                if(nick === CFG.master) {
                    const pass = document.getElementById('key-input').value;
                    if(pass === CFG.token) {
                        this.isRoot = true;
                    } else {
                        alert("TOKEN ERROR");
                        return;
                    }
                }
                
                this.user = nick;
                document.getElementById('gate').style.transform = "translateY(-100%)";
                document.getElementById('sys-info').innerText = this.isRoot ? "SYSTEM: ROOT_ACCESS" : "SYSTEM: STABLE";
                document.getElementById('sys-info').style.color = this.isRoot ? "white" : "#555";
                
                this.sync();
            },

            broadcast() {
                const val = document.getElementById('raw-input').value;
                if(!val.trim()) return;
                
                this.db.ref("global_chat").push({
                    u: this.user,
                    m: val,
                    r: this.isRoot,
                    t: Date.now()
                });
                document.getElementById('raw-input').value = "";
            },

            sync() {
                this.db.ref("global_chat").limitToLast(60).on("child_added", (snap) => {
                    const d = snap.val();
                    const k = snap.key;
                    const isMe = d.u === this.user;
                    
                    const packet = document.createElement('div');
                    packet.className = `packet ${isMe ? 'my-signal' : ''} ${d.r ? 'root-privilege' : ''}`;
                    packet.id = k;
                    
                    let drop = (this.isRoot) ? `<span class="drop-cmd" onclick="Core.drop('${k}')">[DROP]</span>` : "";

                    packet.innerHTML = `
                        <span class="u-name">${d.u} ${drop}</span>
                        <div class="u-text">${d.m}</div>
                    `;
                    document.getElementById('feed').appendChild(packet);
                    document.getElementById('feed').scrollTop = document.getElementById('feed').scrollHeight;
                });

                this.db.ref("global_chat").on("child_removed", (snap) => {
                    const el = document.getElementById(snap.key);
                    if(el) el.remove();
                });
            },

            drop(k) { if(confirm("PERMANENT DROP?")) this.db.ref("global_chat").child(k).remove(); }
        };

        Core.init();
    </script>
</body>
</html>
