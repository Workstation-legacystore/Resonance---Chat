<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL V1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 90vh; border: var(--border); border-radius: 28px; } }
        header, .footer { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.95); z-index: 100; border-bottom: 1px solid #1a1a1a; }
        .footer { border-bottom: none; border-top: 1px solid #1a1a1a; background: #0a0a0a; gap: 12px; }
        .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: #fff; cursor: pointer; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #000; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
        #feed { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 80%; animation: popIn 0.3s ease; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 12px 16px; font-size: 15px; border-radius: 20px; line-height: 1.4; word-wrap: break-word; }
        .msg-wrap.mine .bubble { background: #fff; color: #000; border-radius: 20px 20px 4px 20px; }
        .msg-wrap:not(.mine) .bubble { background: #1a1a1a; color: #fff; border-radius: 20px 20px 20px 4px; }
        .meta { font-size: 9px; color: #555; margin-bottom: 4px; padding: 0 8px; text-transform: uppercase; display: flex; align-items: center; }
        .founder-badge { background: linear-gradient(90deg, #ff453a, #ff9f0a); color: #fff; padding: 2px 8px; border-radius: 6px; font-weight: 900; font-size: 8px; margin-right: 5px; }

        /* SIDEBAR WITH ICON ONLY */
        #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 250px; background: #050505; border-right: var(--border); z-index: 200; transform: translateX(-100%); transition: 0.3s ease; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        #sidebar.open { transform: translateX(0); }
        .exit-icon { color: var(--danger); background: none; border: none; cursor: pointer; display: flex; align-items: center; opacity: 0.6; transition: 0.3s; }
        .exit-icon:hover { opacity: 1; }

        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 300; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .input-std { background: #111; border: 1px solid #222; color: white; padding: 18px; border-radius: 16px; margin-bottom: 12px; width: 100%; font-size: 16px; text-align: center; }
        .auth-step { display: none; width: 100%; } 
        .auth-step.active { display: block; animation: popIn 0.3s; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="app-core">
        <div id="sidebar">
            <div id="admin-zone" style="display:none;">
                <div style="font-size:10px; color:#444; font-weight:800; margin-bottom:15px; letter-spacing:1px;">ADMIN / BANNED</div>
                <div id="ban-list"></div>
            </div>
            <div></div>
            <button onclick="Core.logout()" class="exit-icon" title="Logout">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>

        <div id="auth-gate">
            <div style="text-align:center; margin-bottom:40px;"><h1 style="font-family:'Outfit'; font-size:42px; margin:0; letter-spacing:-2px;">RESONANCE</h1></div>
            <div id="step-1" class="auth-step active">
                <input type="text" id="nick-field" class="input-std" placeholder="Nickname">
                <button onclick="Auth.checkUser()" style="background:#fff; border:none; padding:18px; border-radius:16px; font-weight:800; width:100%; cursor:pointer;">NEXT</button>
            </div>
            <div id="step-login" class="auth-step">
                <input type="password" id="login-pass" class="input-std" placeholder="Password"><button onclick="Auth.doLogin()" style="background:#fff; border:none; padding:18px; border-radius:16px; font-weight:800; width:100%; cursor:pointer;">LOGIN</button>
            </div>
            <div id="step-register" class="auth-step">
                <input type="password" id="reg-pass1" class="input-std" placeholder="New Pass"><input type="password" id="reg-pass2" class="input-std" placeholder="Confirm">
                <button onclick="Auth.doRegister()" style="background:#fff; border:none; padding:18px; border-radius:16px; font-weight:800; width:100%; cursor:pointer;">START</button>
            </div>
        </div>

        <header>
            <button class="icon-btn" onclick="Core.toggleMenu()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
            <div style="font-family:'Outfit'; font-weight:800; font-size:18px;">RESONANCE GLOBAL</div>
            <div id="conn-status" style="width:8px; height:8px; background:#32d74b; border-radius:50%;"></div>
        </header>

        <div id="feed"></div>

        <div class="footer">
            <input type="text" id="msg-input" style="flex:1; background:#161616; border:1px solid #222; padding:0 20px; border-radius:25px; color:#fff; height:44px;" placeholder="Message..." autocomplete="off">
            <button id="send-btn" onclick="Core.send()" class="send-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></button>
        </div>
    </div>

    <script>
        const CFG = { apiKey: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk", dbURL: "https://resonance---chat-default-rtdb.firebaseio.com", admin: "Workstation5495", hash: "UlRXNTQ5NUpFTExZQkVBTg==" };
        const Auth = {
            tempNick: null,
            init() {
                firebase.initializeApp({apiKey: CFG.apiKey, databaseURL: CFG.dbURL});
                if(localStorage.getItem('res_user')) { Core.user = localStorage.getItem('res_user'); Core.isRoot = localStorage.getItem('res_root') === 'true'; Core.checkSecurity(); }
            },
            reset() { document.querySelectorAll('.auth-step').forEach(e => e.classList.remove('active')); document.getElementById('step-1').classList.add('active'); },
            checkUser() {
                const n = document.getElementById('nick-field').value.trim();
                if (n.length < 3) return alert("Min 3 chars");
                this.tempNick = n;
                firebase.database().ref('users/' + n).once('value', s => { if (s.exists()) this.showStep('step-login'); else this.showStep('step-register'); });
            },
            showStep(id) { document.querySelectorAll('.auth-step').forEach(e => e.classList.remove('active')); document.getElementById(id).classList.add('active'); },
            doRegister() {
                const p1 = document.getElementById('reg-pass1').value, p2 = document.getElementById('reg-pass2').value;
                if (p1.length < 8 || p1 !== p2) return alert("Error!");
                firebase.database().ref('users/' + this.tempNick).set({ pass: btoa(p1), joined: Date.now() }).then(() => this.finalizeLogin(this.tempNick, false));
            },
            doLogin() {
                const p = document.getElementById('login-pass').value;
                if (this.tempNick === CFG.admin && btoa(p) === CFG.hash) return this.finalizeLogin(this.tempNick, true);
                firebase.database().ref('users/' + this.tempNick).once('value', s => { if (s.val() && s.val().pass === btoa(p)) this.finalizeLogin(this.tempNick, false); else alert("Wrong Pass"); });
            },
            finalizeLogin(nick, isRoot) { Core.user = nick; Core.isRoot = isRoot; localStorage.setItem('res_user', nick); localStorage.setItem('res_root', isRoot); Core.checkSecurity(); }
        };
        const Core = {
            db: null, user: null, isRoot: false, lastSentTime: 0,
            checkSecurity() { firebase.database().ref("banned/" + this.user).once('value', sn => { if (sn.exists()) { localStorage.clear(); location.reload(); } else { document.getElementById('auth-gate').style.display = "none"; this.initApp(); } }); },
            initApp() {
                this.db = firebase.database();
                this.db.ref("status/" + this.user).onDisconnect().set("offline");
                this.db.ref("status/" + this.user).set("online");
                this.db.ref("chat").limitToLast(40).on("child_added", (s) => this.renderMsg(s.key, s.val()));
                this.db.ref("chat").on("child_removed", s => document.getElementById(s.key)?.remove());
                this.db.ref("kicks/" + this.user).on("value", s => { if(s.exists()) { this.db.ref("kicks/" + this.user).remove(); localStorage.clear(); location.reload(); } });
                if(this.isRoot) this.loadAdmin();
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },
            send() {
                const now = Date.now(); if (now - this.lastSentTime < 3000) return;
                let t = document.getElementById('msg-input').value.trim(); if (!t) return;
                this.lastSentTime = now; this.db.ref("chat").push({ u: this.user, t: t, r: this.isRoot, ts: Date.now() });
                document.getElementById('msg-input').value = "";
            },
            renderMsg(key, d) {
                if (document.getElementById(key) || d.type === "req") return; 
                const f = document.getElementById('feed'); const r = document.createElement('div'); r.id = key; r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                let b = d.r ? `<span class="founder-badge">FOUNDER</span>` : "";
                let t = this.isRoot ? `<span style="color:red; cursor:pointer; font-size:9px; margin-left:10px;" onclick="Core.db.ref('chat/${key}').remove()">DEL</span> <span style="color:red; cursor:pointer; font-size:9px; margin-left:5px;" onclick="Core.ban('${d.u}')">BAN</span>` : "";
                r.innerHTML = `<div class="meta">${b}${d.u}${t}</div><div class="bubble">${d.t}</div>`;
                f.appendChild(r); f.scrollTop = f.scrollHeight;
            },
            loadAdmin() {
                document.getElementById('admin-zone').style.display = 'block';
                this.db.ref("banned").on('value', sn => {
                    const l = document.getElementById('ban-list'); l.innerHTML = "";
                    if(sn.val()) Object.keys(sn.val()).forEach(k => { l.innerHTML += `<div style="color:red; font-size:10px; font-weight:700; margin-bottom:10px;">${k} <span onclick="Core.unban('${k}')" style="color:#fff; cursor:pointer; opacity:0.3; margin-left:5px;">[X]</span></div>`; });
                });
            },
            unban(u) { if(confirm("Unban?")) this.db.ref("banned/" + u).remove(); },
            toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); },
            logout() { if(confirm("Logout?")) { localStorage.clear(); location.reload(); } }
        };
        Auth.init();
    </script>
</body>
</html>
