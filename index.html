<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE /// SYSTEM OVERRIDE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* === SYSTEM CORE STYLES === */
        :root {
            --bg-color: #030305;
            --terminal-green: #0aff0a;
            --alert-red: #ff2a2a;
            --admin-gold: #ffd700;
            --neon-blue: #00f3ff;
            --glass: rgba(10, 10, 15, 0.85);
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline: none; user-select: none; }
        
        body {
            margin: 0; height: 100vh;
            background-color: var(--bg-color);
            font-family: 'JetBrains Mono', monospace;
            color: white;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* Scanline Effect (Retro TV) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* === UI LAYERS === */
        #interface-layer {
            width: 100%; max-width: 600px; height: 100%;
            display: flex; flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Login Modal (Security Gate) */
        #security-gate {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .gate-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3rem;
            letter-spacing: 5px;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 40px;
            animation: glitch 1s infinite alternate;
        }

        .input-group {
            position: relative;
            width: 80%;
            margin-bottom: 20px;
        }

        .cyber-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            padding: 15px;
            color: var(--neon-blue);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .cyber-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn {
            background: var(--neon-blue);
            color: black;
            border: none;
            padding: 15px 40px;
            font-weight: bold;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: 0.3s;
        }

        .cyber-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Chat Interface */
        header {
            padding: 15px;
            border-bottom: 1px solid #333;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: space-between;
            align-items: center;
        }

        .sys-stat { font-size: 10px; color: #555; }
        .active-stat { color: var(--terminal-green); }

        #data-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }

        /* Messages */
        .packet {
            max-width: 85%;
            padding: 10px 15px;
            border-left: 2px solid transparent;
            background: rgba(255,255,255,0.03);
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            animation: packetIn 0.3s ease-out;
        }

        .packet.mine {
            align-self: flex-end;
            border-left: none;
            border-right: 2px solid var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
            text-align: right;
        }

        .packet.admin {
            border: 1px solid var(--admin-gold);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .packet .meta {
            display: block;
            font-size: 9px;
            opacity: 0.5;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .packet.admin .meta { color: var(--admin-gold); font-weight: bold; }

        /* Control Panel */
        .control-panel {
            padding: 20px;
            background: black;
            border-top: 1px solid #333;
            display: flex; gap: 10px;
        }

        /* Animations */
        @keyframes glitch {
            0% { text-shadow: 2px 2px 0px #ff00ff, -2px -2px 0px #00ffff; }
            100% { text-shadow: -2px 2px 0px #ff00ff, 2px -2px 0px #00ffff; }
        }
        @keyframes packetIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="security-gate">
        <div class="gate-logo">RESONANCE<br><span style="font-size:12px">SYSTEM OVERRIDE v9.0</span></div>
        
        <div class="input-group">
            <input type="text" id="auth-nick" class="cyber-input" placeholder="IDENTITY_STRING" maxlength="15">
        </div>
        
        <div class="input-group" id="pass-group" style="display:none;">
            <input type="password" id="auth-pass" class="cyber-input" placeholder="ACCESS_TOKEN (PASSWORD)">
        </div>

        <button class="cyber-btn" onclick="System.initSequence()">INITIALIZE LINK</button>
        <div id="boot-log" style="margin-top:20px; color:#555; font-size:10px; height:20px;"></div>
    </div>

    <div id="interface-layer">
        <header>
            <div>
                <span style="font-weight:bold; color:white;">RES.NET</span>
                <span class="sys-stat"> :: LATENCY <span id="ping">12ms</span></span>
            </div>
            <div id="user-display" class="sys-stat active-stat">GUEST</div>
        </header>

        <div id="data-stream"></div>

        <div class="control-panel">
            <input type="text" id="cmd-input" class="cyber-input" placeholder="ENTER MESSAGE OR COMMAND..." style="border:none; padding:10px;">
            <button class="cyber-btn" style="padding:10px 20px;" onclick="System.transmit()">SEND</button>
        </div>
    </div>

    <script>
        /**
         * RESONANCE CORE KERNEL v9.0
         * Architect: Workstation5495
         */

        // 1. CONFIGURATION
        const CONFIG = {
            firebase: {
                apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA", // Твой ключ
                databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com", // Твоя база
                projectId: "resonance-chat-5495",
                appId: "1:909712050521:web:your_app_id"
            },
            adminNick: "Workstation5495",
            adminHash: "admin", // <--- ПАРОЛЬ АДМИНА ТУТ
            version: "9.0.4"
        };

        // 2. SYSTEM CLASSES (OOP STRUCTURE)
        
        class SecurityModule {
            constructor() {
                this.isAdmin = false;
                this.currentUser = null;
                this.bannedWords = ["spam", "bot"];
            }

            checkIdentity(nick) {
                if (nick === CONFIG.adminNick) return 'REQUIRE_AUTH';
                if (nick.length < 3) return 'INVALID_LEN';
                return 'GRANT_GUEST';
            }

            sanitize(text) {
                return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            elevatePrivileges(pass) {
                if (pass === CONFIG.adminHash) {
                    this.isAdmin = true;
                    return true;
                }
                return false;
            }
        }

        class CoreSystem {
            constructor() {
                firebase.initializeApp(CONFIG.firebase);
                this.db = firebase.database();
                this.security = new SecurityModule();
                this.ui = {
                    gate: document.getElementById('security-gate'),
                    nickInput: document.getElementById('auth-nick'),
                    passInput: document.getElementById('auth-pass'),
                    passGroup: document.getElementById('pass-group'),
                    log: document.getElementById('boot-log'),
                    chat: document.getElementById('data-stream'),
                    input: document.getElementById('cmd-input')
                };
                
                this.setupListeners();
                this.startPing();
            }

            log(msg) {
                this.ui.log.innerText = "> " + msg;
            }

            initSequence() {
                const nick = this.ui.nickInput.value.trim();
                const status = this.security.checkIdentity(nick);

                if (status === 'INVALID_LEN') {
                    this.log("ERROR: IDENTITY TOO SHORT");
                    return;
                }

                if (status === 'REQUIRE_AUTH') {
                    if (this.ui.passGroup.style.display === 'none') {
                        this.ui.passGroup.style.display = 'block';
                        this.log("SECURITY ALERT: ADMIN DETECTED. PROVIDE TOKEN.");
                        return;
                    } else {
                        const pass = this.ui.passInput.value;
                        if (this.security.elevatePrivileges(pass)) {
                            this.login(nick);
                        } else {
                            this.log("ACCESS DENIED. SYSTEM LOCKED.");
                            this.ui.nickInput.value = "";
                        }
                    }
                } else {
                    this.login(nick);
                }
            }

            login(nick) {
                this.security.currentUser = nick;
                this.log("ACCESS GRANTED. WELCOME.");
                
                // Анимация открытия ворот
                setTimeout(() => {
                    this.ui.gate.style.transform = "translateY(-100%)";
                    document.getElementById('user-display').innerText = nick.toUpperCase();
                    if(this.security.isAdmin) {
                        document.getElementById('user-display').style.color = "var(--admin-gold)";
                        document.getElementById('user-display').innerText += " [ROOT]";
                    }
                    this.loadMessages();
                }, 800);
            }

            transmit() {
                const text = this.ui.input.value;
                if (!text.trim()) return;

                // Проверка команд
                if(text.startsWith("/clear") && this.security.isAdmin) {
                    if(confirm("EXECUTE PURGE?")) this.db.ref("global_chat").remove();
                    this.ui.input.value = "";
                    return;
                }

                const safeText = this.security.sanitize(text);

                this.db.ref("global_chat").push({
                    user: this.security.currentUser,
                    msg: safeText,
                    type: this.security.isAdmin ? 'admin' : 'user',
                    timestamp: Date.now()
                });

                this.ui.input.value = "";
            }

            loadMessages() {
                this.db.ref("global_chat").limitToLast(50).on("child_added", (snap) => {
                    const data = snap.val();
                    const key = snap.key;
                    
                    const el = document.createElement("div");
                    const isMe = data.user === this.security.currentUser;
                    
                    el.className = `packet ${isMe ? 'mine' : ''} ${data.type === 'admin' ? 'admin' : ''}`;
                    el.id = key;

                    let deleteBtn = "";
                    if (this.security.isAdmin) {
                        deleteBtn = `<span style="color:red; cursor:pointer; margin-left:10px;" onclick="System.purge('${key}')">[DEL]</span>`;
                    }

                    const time = new Date(data.timestamp).toLocaleTimeString();

                    el.innerHTML = `
                        <span class="meta">${data.user} :: ${time} ${deleteBtn}</span>
                        ${data.msg}
                    `;

                    this.ui.chat.appendChild(el);
                    this.ui.chat.scrollTop = this.ui.chat.scrollHeight;
                });

                // Слушатель удаления
                this.db.ref("global_chat").on("child_removed", (snap) => {
                    const el = document.getElementById(snap.key);
                    if(el) el.remove();
                });
            }

            purge(key) {
                if(this.security.isAdmin) {
                    this.db.ref("global_chat").child(key).remove();
                }
            }

            setupListeners() {
                this.ui.input.onkeypress = (e) => {
                    if(e.key === 'Enter') this.transmit();
                };
                // Динамическая проверка поля ника
                this.ui.nickInput.oninput = () => {
                    if(this.ui.nickInput.value === CONFIG.adminNick) {
                        this.ui.passGroup.style.display = 'block';
                    }
                };
            }

            startPing() {
                setInterval(() => {
                    document.getElementById('ping').innerText = Math.floor(Math.random() * 20 + 10) + "ms";
                }, 2000);
            }
        }

        // 3. INITIALIZATION
        const System = new CoreSystem();

    </script>
</body>
</html>
