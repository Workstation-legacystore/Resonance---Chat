<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { height: 100dvh; background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; display: none; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 95vh; border: var(--border); border-radius: 28px; } }

        /* AUTH GATE - ТУТ ТЕПЕРЬ ПОРЯДОК */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .auth-inp { background: #111; border: 1px solid #222; color: #fff; padding: 18px; border-radius: 14px; margin-bottom: 12px; width: 100%; text-align: center; font-size: 16px; display: block; }
        .auth-btn { background: #fff; color: #000; border: none; padding: 18px; border-radius: 14px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; }
        
        /* КЛАСС ДЛЯ СКРЫТИЯ */
        .hidden { display: none !important; }

        header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #111; }
        #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 12px 16px; font-size: 15px; border-radius: 18px; background: #1a1a1a; }
        .msg-wrap.mine .bubble { background: #fff; color: #000; }
        
        .footer { height: 70px; padding: 0 15px; display: flex; align-items: center; gap: 10px; background: #050505; }
        .msg-input { flex: 1; background: #111; border: none; padding: 0 15px; border-radius: 20px; color: #fff; height: 44px; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="auth-gate">
        <h1 style="font-family:'Outfit'; font-size:42px; text-align:center; margin-bottom:40px; letter-spacing:-2px;">RESONANCE</h1>
        
        <div id="step-1">
            <input type="text" id="nick-field" class="auth-inp" placeholder="Identity Name">
            <button onclick="Auth.checkUser()" class="auth-btn">VERIFY</button>
        </div>

        <div id="step-login" class="hidden">
            <input type="password" id="login-pass" class="auth-inp" placeholder="Password">
            <button onclick="Auth.doLogin()" class="auth-btn">LINK SYSTEM</button>
            <button onclick="Auth.reset()" style="color:#444; background:none; border:none; width:100%; margin-top:15px;">Back</button>
        </div>

        <div id="step-register" class="hidden">
            <input type="password" id="reg-pass" class="auth-inp" placeholder="Create Password (min 8)">
            <button onclick="Auth.doRegister()" class="auth-btn">INITIALIZE</button>
            <button onclick="Auth.reset()" style="color:#444; background:none; border:none; width:100%; margin-top:15px;">Back</button>
        </div>
    </div>

    <div id="app-core">
        <header><div style="font-family:'Outfit'; font-weight:800;">RESONANCE GLOBAL</div></header>
        <div id="feed"></div>
        <div class="footer">
            <input type="text" id="msg-input" class="msg-input" placeholder="...">
            <button onclick="Core.send()" class="send-btn">▲</button>
        </div>
    </div>

    <script>
        const CFG = { k: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk", d: "https://resonance---chat-default-rtdb.firebaseio.com", a: "Workstation5495", h: "UlRXNTQ5NUpFTExZQkVBTg==" };
        
        const Auth = {
            t: null,
            init() { 
                firebase.initializeApp({apiKey: CFG.k, databaseURL: CFG.d}); 
                const saved = localStorage.getItem('res_user');
                if(saved) this.finalize(saved, localStorage.getItem('res_root') === 'true');
            },
            reset() { 
                document.getElementById('step-1').classList.remove('hidden');
                document.getElementById('step-login').classList.add('hidden');
                document.getElementById('step-register').classList.add('hidden');
            },
            checkUser() {
                const n = document.getElementById('nick-field').value.trim();
                if (n.length < 3) return;
                this.t = n;
                firebase.database().ref('users/' + n).once('value', s => {
                    document.getElementById('step-1').classList.add('hidden');
                    if (s.exists()) document.getElementById('step-login').classList.remove('hidden');
                    else document.getElementById('step-register').classList.remove('hidden');
                });
            },
            doLogin() {
                const p = document.getElementById('login-pass').value;
                if (this.t === CFG.a && btoa(p) === CFG.h) return this.finalize(this.t, true);
                firebase.database().ref('users/' + this.t).once('value', s => {
                    if (s.val() && s.val().pass === btoa(p)) this.finalize(this.t, false);
                    else alert("WRONG");
                });
            },
            doRegister() {
                const p = document.getElementById('reg-pass').value;
                if (p.length < 8 || this.t === CFG.a) return alert("ERROR");
                firebase.database().ref('users/' + this.t).set({ pass: btoa(p) }).then(() => this.finalize(this.t, false));
            },
            finalize(n, r) {
                localStorage.setItem('res_user', n);
                localStorage.setItem('res_root', r);
                Core.user = n; Core.isRoot = r;
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app-core').style.display = 'flex';
                Core.run();
            }
        };

        const Core = {
            user: null, isRoot: false,
            run() {
                this.db = firebase.database();
                this.db.ref("chat").limitToLast(50).on("child_added", s => this.draw(s.key, s.val()));
                document.getElementById('msg-input').onkeypress = (e) => { if(e.key==='Enter') this.send(); };
            },
            send() {
                let t = document.getElementById('msg-input').value.trim(); if(!t) return;
                this.db.ref("chat").push({ u: this.user, t: t, r: this.isRoot });
                document.getElementById('msg-input').value = "";
            },
            draw(k, d) {
                const f = document.getElementById('feed'), r = document.createElement('div');
                r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                r.innerHTML = `<div style="font-size:9px; color:#444;">${d.u}</div><div class="bubble">${d.t}</div>`;
                f.appendChild(r); f.scrollTop = f.scrollHeight;
            }
        };
        Auth.init();
    </script>
</body>
</html>
