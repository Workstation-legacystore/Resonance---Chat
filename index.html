<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE CHAT | Global</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --surface: #141414;
            --primary: #ffffff;
            --secondary: #888888;
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --danger: #ff453a;
            --font-brand: 'Outfit', sans-serif;
            --font-ui: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; height: 100dvh;
            background: var(--bg);
            color: var(--primary);
            font-family: var(--font-ui);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* --- RESPONSIVE LAYOUT --- */
        #app-root {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background: var(--card-bg);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 600px) {
            #app-root {
                max-width: 450px; height: 90vh;
                border: var(--border); border-radius: 24px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            }
        }

        /* --- AUTH LAYER --- */
        #auth-layer {
            position: absolute; inset: 0;
            background: var(--card-bg);
            z-index: 999;
            display: flex; flex-direction: column;
            justify-content: center; padding: 40px;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .brand-logo {
            font-family: var(--font-brand);
            font-size: 32px; font-weight: 800; letter-spacing: -1px;
            margin-bottom: 5px; background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .brand-slogan {
            font-size: 11px; color: var(--secondary); margin-bottom: 50px;
            letter-spacing: 2px; text-transform: uppercase;
        }

        .input-std {
            background: var(--surface); border: var(--border);
            color: white; padding: 18px; border-radius: 12px;
            font-size: 16px; margin-bottom: 15px; font-family: var(--font-ui);
            transition: 0.3s;
        }

        .btn-main {
            background: var(--primary); color: black; border: none;
            padding: 18px; border-radius: 12px; font-weight: 700;
            font-size: 14px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.2s; font-family: var(--font-brand);
        }

        /* --- CHAT HEADER --- */
        header {
            padding: 15px 20px; border-bottom: var(--border);
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center;
        }

        .header-info h1 { margin: 0; font-family: var(--font-brand); font-size: 18px; font-weight: 700; }
        .header-info p { margin: 2px 0 0 0; font-size: 10px; color: var(--secondary); text-transform: uppercase; letter-spacing: 1.5px; }

        .status-dot {
            height: 8px; width: 8px; background: #32d74b;
            border-radius: 50%; box-shadow: 0 0 10px #32d74b;
            opacity: 0; transition: 0.5s;
        }
        .status-dot.active { opacity: 1; }

        /* --- CHAT FEED --- */
        #chat-feed {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .msg-row { display: flex; flex-direction: column; max-width: 85%; animation: fadeUp 0.3s ease; }
        .msg-row.mine { align-self: flex-end; align-items: flex-end; }

        .sender { font-size: 10px; color: var(--secondary); margin-bottom: 4px; padding: 0 5px; }

        .bubble {
            padding: 12px 16px; border-radius: 18px;
            background: var(--surface); border: 1px solid rgba(255,255,255,0.05);
            font-size: 15px; line-height: 1.4;
        }
        
        .msg-row.mine .bubble {
            background: #ffffff; color: #000;
            border-bottom-right-radius: 4px;
        }

        .msg-row.admin .bubble { border: 1px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .msg-row.admin .sender { color: #fff; font-weight: bold; }

        /* --- FOOTER --- */
        .footer {
            padding: 15px; border-top: var(--border);
            background: var(--card-bg); display: flex; gap: 10px;
        }

        .input-msg {
            flex: 1; background: var(--surface); border: none;
            padding: 12px 18px; border-radius: 25px; color: white;
            font-size: 15px;
        }
        
        .send-btn {
            background: var(--primary); color: black; border: none;
            width: 42px; height: 42px; border-radius: 50%;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }

        .del-link { color: var(--danger); font-size: 9px; margin-left: 8px; cursor: pointer; font-weight: bold; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 0px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app-root">
        <div id="auth-layer">
            <div class="brand-logo">RESONANCE</div>
            <div class="brand-slogan">Always on Touch</div>
            
            <input type="text" id="nick-field" class="input-std" placeholder="Nickname" maxlength="15">
            <input type="password" id="pass-field" class="input-std" placeholder="Secure Token" style="display:none">
            
            <button class="btn-main" onclick="App.login()">Connect</button>
        </div>

        <header>
            <div class="header-info">
                <h1>RESONANCE CHAT</h1>
                <p>Always on Touch</p>
            </div>
            <div id="status-ind" class="status-dot"></div>
        </header>

        <div id="chat-feed"></div>

        <div class="footer">
            <input type="text" id="msg-input" class="input-msg" placeholder="Message...">
            <button class="send-btn" onclick="App.send()">↑</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com",
            projectId: "resonance-chat-5495",
            adminNick: "Workstation5495",
            adminHash: "NTQ5NQ==" // Base64 for "5495"
        };

        const App = {
            db: null, user: null, isRoot: false,

            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();

                const savedUser = localStorage.getItem('res_user_v10');
                if (savedUser) {
                    this.user = savedUser;
                    this.isRoot = localStorage.getItem('res_root_v10') === 'true';
                    this.enter();
                }

                document.getElementById('nick-field').oninput = (e) => {
                    document.getElementById('pass-field').style.display = (e.target.value === CONFIG.adminNick) ? 'block' : 'none';
                };
                
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },

            login() {
                const nick = document.getElementById('nick-field').value.trim();
                if (!nick) return;

                if (nick === CONFIG.adminNick) {
                    const pass = document.getElementById('pass-field').value;
                    if (btoa(pass) === CONFIG.adminHash) {
                        this.isRoot = true;
                        localStorage.setItem('res_root_v10', 'true');
                    } else { return alert("Invalid Token"); }
                }

                this.user = nick;
                localStorage.setItem('res_user_v10', nick);
                this.enter();
            },

            enter() {
                document.getElementById('auth-layer').style.transform = "translateY(-100%)";
                setTimeout(() => document.getElementById('status-ind').classList.add('active'), 500);
                this.listen();
            },

            send() {
                const inp = document.getElementById('msg-input');
                if (!inp.value.trim()) return;

                this.db.ref("global_chat").push({
                    u: this.user,
                    t: inp.value.replace(/</g, "&lt;"),
                    r: this.isRoot,
                    ts: Date.now()
                });
                inp.value = "";
            },

            listen() {
                this.db.ref("global_chat").limitToLast(100).on("child_added", (s) => {
                    const d = s.val();
                    const feed = document.getElementById('chat-feed');
                    const isMe = d.u === this.user;
                    
                    const row = document.createElement('div');
                    row.id = s.key;
                    row.className = `msg-row ${isMe ? 'mine' : ''} ${d.r ? 'admin' : ''}`;

                    const del = (this.isRoot) ? `<span class="del-link" onclick="App.del('${s.key}')">DROP</span>` : '';

                    row.innerHTML = `
                        <div class="sender">${d.u} ${del}</div>
                        <div class="bubble">${d.t}</div>
                    `;
                    
                    feed.appendChild(row);
                    feed.scrollTop = feed.scrollHeight;
                });
                
                this.db.ref("global_chat").on("child_removed", (s) => {
                    const el = document.getElementById(s.key);
                    if(el) el.remove();
                });
            },

            del(k) { if(confirm("Purge signal?")) this.db.ref("global_chat").child(k).remove(); }
        };

        App.init();
    </script>
</body>
</html>
