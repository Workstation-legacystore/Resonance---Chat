<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance — Workstation5495 Edition</title>
    
    <style>
        /* === ТВОЙ CSS ТЕПЕРЬ ТУТ === */
        :root {
            --bg: #0f172a;
            --accent: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: white;
            display: flex; justify-content: center; align-items: center;
        }

        /* Экран входа */
        #auth-screen {
            text-align: center;
            background: var(--glass);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .icon-box {
            font-size: 50px; margin-bottom: 20px;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        /* Главный контейнер чата (скрыт до входа) */
        #chat-app {
            display: none;
            width: 100%; max-width: 500px; height: 90vh;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
            border-radius: 25px; border: 1px solid var(--border);
            overflow: hidden;
        }

        #messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .msg {
            padding: 12px 16px; border-radius: 18px;
            max-width: 80%; line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .user-msg { background: var(--glass); align-self: flex-start; border: 1px solid var(--border); }
        .admin-msg { background: var(--accent); color: #000; align-self: flex-end; font-weight: 500; }

        .input-area {
            padding: 20px; background: rgba(0,0,0,0.2);
            display: flex; gap: 10px;
        }

        input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 12px; border-radius: 12px;
            color: white; outline: none; flex: 1;
        }

        .btn {
            background: var(--accent); border: none;
            padding: 12px 25px; border-radius: 12px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }

        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="icon-box">📡</div>
        <h2>RESONANCE</h2>
        <p style="opacity: 0.6; font-size: 14px;">Always on Touch</p>
        <input type="text" id="login-nick" placeholder="Enter Nickname" style="width: 200px; margin-bottom: 10px;"><br>
        <button class="btn" onclick="tryLogin()">Connect</button>
    </div>

    <div id="chat-app">
        <header style="padding: 15px; border-bottom: 1px solid var(--border); text-align: center;">
            <span id="display-name" style="color: var(--accent); font-weight: bold;"></span>
        </header>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Write a message...">
            <button class="btn" onclick="send()">↑</button>
        </div>
    </div>

    <script>
        // ТВОИ КЛЮЧИ (Вставь свои!)
        const firebaseConfig = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com",
            projectId: "resonance-chat-5495",
            appId: "1:909712050521:web:your_app_id"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myNick = "";
        let isAdmin = false;
        const ADMIN_PASS = "ТВОЙ_ПАРОЛЬ"; // ПРИДУМАЙ И ВПИШИ ТУТ!

        function tryLogin() {
            const nick = document.getElementById('login-nick').value.trim();
            if(!nick) return alert("Enter nickname!");

            if(nick === "Workstation5495") {
                const p = prompt("Admin Password:");
                if(p === ADMIN_PASS) {
                    isAdmin = true;
                } else {
                    return alert("Wrong password!");
                }
            }

            myNick = nick;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('display-name').innerText = "Logged as: " + myNick;
        }

        function send() {
            const text = document.getElementById('msgInput').value;
            if(text.trim()) {
                db.ref("global_chat").push({
                    name: myNick,
                    text: text,
                    admin: isAdmin,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });
                document.getElementById('msgInput').value = "";
            }
        }

        db.ref("global_chat").on("child_added", (snap) => {
            const d = snap.val();
            const m = document.createElement("div");
            m.className = d.admin ? "msg admin-msg" : "msg user-msg";
            m.innerHTML = `<small style="font-size: 10px; opacity: 0.7;">${d.name}</small><br>${d.text}`;
            document.getElementById('messages').appendChild(m);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    </script>
</body>
</html>
