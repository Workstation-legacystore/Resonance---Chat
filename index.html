<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #111; --card: #0a0a0a; --text: #fff; --text-dim: #888; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 90vh; border: var(--border); border-radius: 28px; box-shadow: 0 40px 80px rgba(0,0,0,0.8); } }
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 40px; transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1); }
        .brand-logo { font-family: 'Outfit', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -2px; margin-bottom: 5px; }
        .brand-sub { font-size: 10px; color: var(--text-dim); margin-bottom: 50px; letter-spacing: 4px; text-transform: uppercase; }
        .input-std { background: #1a1a1a; border: 1px solid #333; color: white; padding: 18px; border-radius: 16px; font-size: 16px; margin-bottom: 15px; }
        .btn-main { background: white; color: black; border: none; padding: 18px; border-radius: 16px; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        header { padding: 15px 20px; background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logout-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; }
        .header-title h1 { margin: 0; font-family: 'Outfit', sans-serif; font-size: 16px; }
        .header-title p { margin: 0; font-size: 9px; color: var(--text-dim); }
        .status-led { width: 8px; height: 8px; background: #32d74b; border-radius: 50%; box-shadow: 0 0 12px #32d74b; opacity: 0; transition: 0.5s; }
        .status-led.online { opacity: 1; }
        #feed { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 80%; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .meta { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; padding: 0 8px; }
        .bubble { padding: 10px 16px; font-size: 15px; line-height: 1.4; overflow-wrap: break-word; position: relative; }
        .msg-wrap.mine .bubble { background: #fff; color: #000; border-radius: 22px 22px 4px 22px; }
        .msg-wrap:not(.mine) .bubble { background: #1e1e1e; color: #fff; border-radius: 22px 22px 22px 4px; }
        .footer { padding: 12px 15px; border-top: 1px solid #222; background: #0a0a0a; display: flex; gap: 8px; align-items: center; }
        .input-msg { flex: 1; background: #1a1a1a; border: none; padding: 12px 18px; border-radius: 25px; color: white; font-size: 15px; }
        .send-btn { width: 42px; height: 42px; border-radius: 50%; background: white; color: black; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .drop-link { color: var(--danger); margin-left: 6px; font-weight: 700; cursor: pointer; font-size: 9px; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        ::-webkit-scrollbar { width: 0px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="app-core">
        <div id="auth-gate">
            <div class="brand-logo">RESONANCE</div>
            <div class="brand-sub">BUBBLE CORE v13</div>
            <input type="text" id="nick-field" class="input-std" placeholder="Nickname" maxlength="15">
            <input type="password" id="pass-field" class="input-std" placeholder="Secure Token" style="display:none">
            <button class="btn-main" onclick="Core.login()">Connect</button>
        </div>
        <header><div class="header-left"><button class="logout-btn" onclick="Core.logout()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button><div class="header-title"><h1>RESONANCE</h1><p>Global Network</p></div></div><div id="status-led" class="status-led"></div></header>
        <div id="feed"></div>
        <div class="footer"><input type="text" id="msg-input" class="input-msg" placeholder="Message..."><button class="send-btn" onclick="Core.send()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></button></div>
    </div>
    <script>
        const CONFIG = {
            apiKey: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk",
            databaseURL: "https://resonance---chat-default-rtdb.firebaseio.com",
            projectId: "resonance---chat",
            admin: "Workstation5495",
            hash: "UlRXNTQ5NUpFTExZQkVBTg=="
        };
        const Core = {
            db: null, user: null, isRoot: false,
            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();
                const s = localStorage.getItem('res_core_user');
                if (s) { this.user = s; this.isRoot = localStorage.getItem('res_core_root') === 'true'; this.open(); }
                document.getElementById('nick-field').oninput = (e) => { document.getElementById('pass-field').style.display = (e.target.value === CONFIG.admin) ? 'block' : 'none'; };
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },
            login() {
                const n = document.getElementById('nick-field').value.trim();
                if (!n) return;
                if (n === CONFIG.admin) {
                    const p = document.getElementById('pass-field').value;
                    if (btoa(p) === CONFIG.hash) { this.isRoot = true; localStorage.setItem('res_core_root', 'true'); }
                    else return alert("DENIED");
                }
                this.user = n; localStorage.setItem('res_core_user', n); this.open();
            },
            logout() { if(confirm("Logout?")) { localStorage.clear(); location.reload(); } },
            open() { document.getElementById('auth-gate').style.transform = "translateY(-100%)"; setTimeout(() => document.getElementById('status-led').classList.add('online'), 500); this.sync(); },
            send() {
                const i = document.getElementById('msg-input');
                const v = i.value.trim();
                if (!v) return;
                this.db.ref("chat").push({ u: this.user, t: v.replace(/</g, "&lt;"), r: this.isRoot, ts: Date.now() });
                i.value = "";
            },
            sync() {
                this.db.ref("chat").limitToLast(100).on("child_added", (s) => {
                    const d = s.val(); const f = document.getElementById('feed'); const m = d.u === this.user;
                    const r = document.createElement('div'); r.id = s.key; r.className = `msg-wrap ${m ? 'mine' : ''} ${d.r ? 'admin' : ''}`;
                    r.innerHTML = `<div class="meta">${d.u} ${this.isRoot ? `<span class="drop-link" onclick="Core.drop('${s.key}')">DEL</span>` : ''}</div><div class="bubble">${d.t}</div>`;
                    f.appendChild(r); f.scrollTop = f.scrollHeight;
                });
                this.db.ref("chat").on("child_removed", (s) => { const e = document.getElementById(s.key); if(e) e.remove(); });
            },
            drop(k) { if(confirm("DELETE?")) this.db.ref("chat").child(k).remove(); }
        };
        Core.init();
    </script>
</body>
</html>
