<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --surface: #111; --card: #0a0a0a; --text: #fff; --text-dim: #666; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; --accent: #fff; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 90vh; border: var(--border); border-radius: 28px; box-shadow: 0 40px 80px rgba(0,0,0,0.8); } }

        /* SIDEBAR (FRIENDS & MENU) */
        #sidebar { position: absolute; left: -280px; top: 0; bottom: 0; width: 280px; background: #050505; border-right: var(--border); z-index: 50; transition: 0.4s cubic-bezier(0.8, 0, 0.2, 1); padding: 25px; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .sidebar-title { font-family: 'Outfit'; font-size: 20px; font-weight: 800; }
        
        #f-list { flex: 1; overflow-y: auto; margin-top: 20px; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 12px; border-radius: 14px; margin-bottom: 8px; font-size: 14px; border: 1px solid #222; }
        .online-dot { width: 8px; height: 8px; background: #32d74b; border-radius: 50%; margin-right: 10px; }

        /* AUTH GATE */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 40px; transition: 0.8s; }
        .input-std { background: #111; border: 1px solid #222; color: white; padding: 18px; border-radius: 16px; font-size: 16px; margin-bottom: 12px; }
        .btn-main { background: white; color: black; border: none; padding: 18px; border-radius: 16px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; }

        /* HEADER */
        header { padding: 15px 20px; background: rgba(10,10,10,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .menu-btn { cursor: pointer; color: var(--text); background: none; border: none; }

        /* CHAT FEED */
        #feed { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: popIn 0.3s ease; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 12px 16px; font-size: 15px; border-radius: 20px; line-height: 1.4; word-wrap: break-word; }
        .msg-wrap.mine .bubble { background: #fff; color: #000; border-radius: 20px 20px 4px 20px; }
        .msg-wrap:not(.mine) .bubble { background: #1a1a1a; color: #fff; border-radius: 20px 20px 20px 4px; }
        .meta { font-size: 9px; color: #555; margin-bottom: 4px; padding: 0 5px; display: flex; gap: 8px; }

        /* FOOTER */
        .footer { padding: 15px; background: #0a0a0a; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; align-items: center; }
        .input-msg { flex: 1; background: #161616; border: 1px solid #222; padding: 12px 20px; border-radius: 25px; color: white; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } }
        ::-webkit-scrollbar { width: 0px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="app-core">
        
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">NETWORK</div>
                <button onclick="Core.toggleMenu()" style="background:none; border:none; color:#666; font-size:20px;">×</button>
            </div>
            
            <div style="display:flex; gap:8px;">
                <input type="text" id="f-input" class="input-msg" style="font-size:12px; padding:10px;" placeholder="Add Nickname">
                <button onclick="Core.addFriend()" style="background:#fff; border:none; border-radius:50%; width:32px; height:32px; font-weight:bold;">+</button>
            </div>

            <div id="f-list"></div>

            <button onclick="Core.logout()" style="margin-top:auto; background:rgba(255,69,58,0.1); color:var(--danger); border:none; padding:15px; border-radius:14px; font-weight:800; cursor:pointer;">EXIT SYSTEM</button>
        </div>

        <div id="auth-gate">
            <h1 style="font-family:'Outfit'; font-size:42px; margin:0; letter-spacing:-2px;">RESONANCE</h1>
            <p style="color:#333; letter-spacing:3px; font-size:10px; margin-bottom:40px; text-transform:uppercase;">v1.2.2</p>
            <input type="text" id="nick-field" class="input-std" placeholder="Identity Nickname" maxlength="15">
            <input type="password" id="pass-field" class="input-std" placeholder="Admin Token" style="display:none">
            <button onclick="Core.login()" class="btn-main">INITIALIZE</button>
        </div>

        <header>
            <button class="menu-btn" onclick="Core.toggleMenu()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div style="font-family:'Outfit'; font-weight:800; letter-spacing:-0.5px;">RESONANCE</div>
            <div style="width:8px; height:8px; background:#32d74b; border-radius:50%; box-shadow:0 0 10px #32d74b;"></div>
        </header>

        <div id="feed"></div>

        <div class="footer">
            <input type="text" id="msg-input" class="input-msg" placeholder="Write message..." autocomplete="off">
            <button onclick="Core.send()" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiKey: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk",
            databaseURL: "https://resonance---chat-default-rtdb.firebaseio.com",
            projectId: "resonance---chat",
            admin: "Workstation5495",
            hash: "UlRXNTQ5NUpFTExZQkVBTg=="
        };

        const BAD_WORDS = ["fuck", "bitch", "bitch", "dick ", "cunt", "bastard", "БЛЯДЬ", "ЕБАТЬ", "ПИЗДА", "ХУЙ", "ЗАЕБАЛ", "EБАЛ"]; // Добавь свои сюда

        const Core = {
            db: null, user: null, isRoot: false, friends: [],
            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();
                this.friends = JSON.parse(localStorage.getItem('res_friends_v2') || "[]");
                
                const s = localStorage.getItem('res_core_user');
                if (s) { this.user = s; this.isRoot = localStorage.getItem('res_core_root') === 'true'; this.open(); }
                
                document.getElementById('nick-field').oninput = (e) => { 
                    document.getElementById('pass-field').style.display = (e.target.value === CONFIG.admin) ? 'block' : 'none'; 
                };
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },
            
            login() {
                const n = document.getElementById('nick-field').value.trim();
                if (n.length < 3 || !/^[A-Za-z0-9_]+$/.test(n)) return alert("SECURITY: Invalid Nickname");
                
                if (n === CONFIG.admin) {
                    if (btoa(document.getElementById('pass-field').value) === CONFIG.hash) { 
                        this.isRoot = true; localStorage.setItem('res_core_root', 'true'); 
                    } else return alert("ACCESS DENIED");
                }
                this.user = n; localStorage.setItem('res_core_user', n); this.open();
            },

            open() { document.getElementById('auth-gate').style.display = "none"; this.sync(); this.renderFriends(); },
            toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); },
            logout() { if(confirm("Terminate session?")) { localStorage.clear(); location.reload(); } },
            
            addFriend() {
                const n = document.getElementById('f-input').value.trim();
                if (n && !this.friends.includes(n)) {
                    this.friends.push(n);
                    localStorage.setItem('res_friends_v2', JSON.stringify(this.friends));
                    this.renderFriends();
                }
                document.getElementById('f-input').value = "";
            },
            removeFriend(n) { this.friends = this.friends.filter(f => f !== n); localStorage.setItem('res_friends_v2', JSON.stringify(this.friends)); this.renderFriends(); },
            renderFriends() {
                const l = document.getElementById('f-list'); l.innerHTML = "";
                this.friends.forEach(f => {
                    l.innerHTML += `<div class="friend-item">
                        <div style="display:flex; align-items:center;"><div class="online-dot"></div>${f}</div>
                        <span onclick="Core.removeFriend('${f}')" style="color:red; cursor:pointer; font-weight:bold; font-size:10px;">DEL</span>
                    </div>`;
                });
            },

            censor(text) {
                let clean = text;
                BAD_WORDS.forEach(word => { clean = clean.replace(new RegExp(word, "gi"), "***"); });
                return clean;
            },

            send() {
                const i = document.getElementById('msg-input');
                let t = i.value.trim();
                if (!t) return;
                this.db.ref("chat").push({ u: this.user, t: this.censor(t), r: this.isRoot, ts: Date.now() });
                i.value = "";
            },

            sync() {
                this.db.ref("chat").limitToLast(50).on("child_added", (s) => {
                    const d = s.val(); const f = document.getElementById('feed');
                    const r = document.createElement('div'); r.id = s.key;
                    r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                    r.innerHTML = `<div class="meta">${d.u} ${this.isRoot ? `<span onclick="Core.drop('${s.key}')" style="color:red; cursor:pointer;">DEL</span>` : ''}</div><div class="bubble">${d.t}</div>`;
                    f.appendChild(r); f.scrollTop = f.scrollHeight;
                });
                this.db.ref("chat").on("child_removed", (s) => document.getElementById(s.key)?.remove());
            },
            drop(k) { if(confirm("Delete?")) this.db.ref("chat").child(k).remove(); }
        };
        Core.init();
    </script>
</body>
</html>
