<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --border: 1px solid rgba(255,255,255,0.08); --danger: #ff453a; --success: #32d74b; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { height: 100dvh; background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        #app-core { 
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            background: var(--card); position: relative; overflow: hidden; display: none; 
            animation: fadeIn 0.5s ease;
        }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 95vh; border: var(--border); border-radius: 28px; box-shadow: 0 40px 80px rgba(0,0,0,0.9); } }

        /* AUTH GATE */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .auth-step { display: none; width: 100%; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .auth-step.active { display: block !important; }
        .auth-inp { background: #111; border: 1px solid #222; color: #fff; padding: 20px; border-radius: 18px; margin-bottom: 12px; width: 100%; text-align: center; font-size: 16px; transition: 0.3s; }
        .auth-btn { background: #fff; color: #000; border: none; padding: 20px; border-radius: 18px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; }

        /* UI */
        header { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #161616; background: rgba(10,10,10,0.98); backdrop-filter: blur(10px); z-index: 20; }
        .brand { font-family: 'Outfit'; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }

        /* SIDEBAR & ADMIN */
        #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; background: #080808; border-right: 1px solid #222; z-index: 500; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 30px; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); box-shadow: 100px 0 300px rgba(0,0,0,0.9); }
        #admin-zone { display: none; padding: 15px; border: 1px solid rgba(255, 69, 58, 0.3); border-radius: 16px; background: rgba(255,69,58,0.05); margin-bottom: 20px; overflow-y: auto; max-height: 300px; }
        .ban-item { font-size: 11px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--danger); }

        #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s ease; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 14px 18px; font-size: 15px; border-radius: 22px; line-height: 1.4; background: #1a1a1a; word-wrap: break-word; }
        .mine .bubble { background: #fff; color: #000; border-bottom-right-radius: 4px; }

        .meta { font-size: 10px; color: #555; margin-bottom: 5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .founder-badge { background: linear-gradient(90deg, #ff453a, #ff9f0a); color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 900; box-shadow: 0 0 15px rgba(255, 69, 58, 0.5); animation: pulse 2s infinite; }

        /* ICONS */
        .admin-tools { display: flex; gap: 10px; margin-left: 8px; opacity: 0.6; }
        .adm-icon { width: 14px; height: 14px; cursor: pointer; color: var(--danger); fill: none; stroke: currentColor; stroke-width: 2.5; }

        .footer { height: 80px; padding: 0 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #161616; background: #0a0a0a; position: relative; }
        .msg-input { flex: 1; background: #111; border: 1px solid #222; padding: 0 20px; border-radius: 24px; color: #fff; height: 50px; font-size: 16px; }
        .send-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="auth-gate">
        <div style="text-align:center; margin-bottom:50px;"><h1 style="font-family:'Outfit'; font-size:48px; margin:0;">RESONANCE</h1><div style="color:#444; font-size:10px; font-weight:700; margin-top:10px;">Always in touch v3.8.6</div></div>
        <div id="st-1" class="auth-step active"><input type="text" id="n-f" class="auth-inp" placeholder="Identity Name"><button onclick="Auth.check()" class="auth-btn">VERIFY</button></div>
        <div id="st-l" class="auth-step"><input type="password" id="l-p" class="auth-inp" placeholder="Password"><button onclick="Auth.login()" class="auth-btn">LOGIN</button></div>
        <div id="st-r" class="auth-step"><input type="password" id="r-p1" class="auth-inp" placeholder="New Pass (8+)"><input type="password" id="r-p2" class="auth-inp" placeholder="Confirm Pass"><button onclick="Auth.reg()" class="auth-btn">SIGN-UP</button></div>
    </div>

    <div id="app-core">
        <div id="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;"><div style="font-family:'Outfit'; font-size:24px; font-weight:800;">MENU</div><button onclick="Core.toggleMenu()" style="color:#555; background:none; border:none; font-size:28px;">&times;</button></div>
            <div id="admin-zone">
                <div style="font-size:10px; color:var(--danger); font-weight:800; margin-bottom:12px; letter-spacing:1px;">BLACKLIST</div>
                <div id="ban-list"></div>
            </div>
            <button onclick="Core.logout()" style="margin-top:auto; background:rgba(255,69,58,0.1); color:var(--danger); border:none; padding:18px; border-radius:14px; font-weight:700; cursor:pointer;">DISCONNECT</button>
        </div>
        <header><button onclick="Core.toggleMenu()" style="background:none; border:none; color:#fff; cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><div class="brand">RESONANCE</div><div style="width:8px; height:8px; background:#32d74b; border-radius:50%;"></div></header>
        <div id="feed"></div>
        <div class="footer"><input type="text" id="msg-input" class="msg-input" placeholder="Broadcast..."><button id="send-btn" onclick="Core.send()" class="send-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></button></div>
    </div>

    <script>
        const DEV_ID = btoa(navigator.userAgent + navigator.language).substring(0, 16);
        const CFG = { k: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk", d: "https://resonance---chat-default-rtdb.firebaseio.com", a: "Workstation5495", h: "UlRXNTQ5NUpFTExZQkVBTg==" };

        const Auth = {
            t: null,
            init() { 
                firebase.initializeApp({apiKey: CFG.k, databaseURL: CFG.d}); 
                const u = localStorage.getItem('res_user');
                if(u) {
                    firebase.database().ref("users/"+u).once('value', s => {
                        const d = s.val();
                        if(u === CFG.a && d && d.dev && d.dev !== DEV_ID) { this.fail(); return; }
                        firebase.database().ref("banned/"+u).once('value', b => { if(b.exists()) this.fail(); else this.fin(u, localStorage.getItem('res_root') === 'true'); });
                    });
                }
            },
            check() {
                const n = document.getElementById('n-f').value.trim(); if(n.length<3) return;
                this.t = n;
                firebase.database().ref("banned/"+n).once('value', s => {
                    if(s.exists()) return alert("BANNED");
                    firebase.database().ref('users/'+n).once('value', v => {
                        document.querySelectorAll('.auth-step').forEach(e => e.classList.remove('active'));
                        if (v.exists()) document.getElementById('st-l').classList.add('active'); else document.getElementById('st-r').classList.add('active');
                    });
                });
            },
            login() {
                const p = document.getElementById('l-p').value;
                firebase.database().ref('users/'+this.t).once('value', s => {
                    const d = s.val();
                    if (this.t === CFG.a && btoa(p) === CFG.h) {
                        if (!d.dev) firebase.database().ref('users/'+this.t).update({dev: DEV_ID});
                        this.fin(this.t, true);
                    } else if (d && d.pass === btoa(p)) this.fin(this.t, false); else alert("WRONG");
                });
            },
            reg() {
                const p1 = document.getElementById('r-p1').value, p2 = document.getElementById('r-p2').value;
                if (p1 !== p2 || p1.length < 8) return alert("CHECK PASS");
                firebase.database().ref('users/'+this.t).set({ pass: btoa(p1), ts: Date.now() }).then(() => this.fin(this.t, false));
            },
            fin(n, r) { localStorage.setItem('res_user', n); localStorage.setItem('res_root', r); Core.user = n; Core.isRoot = r; this.ok(); },
            ok() { document.getElementById('auth-gate').style.display = "none"; document.getElementById('app-core').style.display = "flex"; Core.run(); },
            fail() { localStorage.clear(); location.reload(); }
        };

        const Core = {
            last: 0,
            run() {
                this.db = firebase.database();
                this.db.ref("chat").limitToLast(50).on("child_added", s => this.draw(s.key, s.val()));
                this.db.ref("chat").on("child_removed", s => document.getElementById(s.key)?.remove());
                firebase.database().ref("banned/"+this.user).on('value', s => { if(s.exists()) Auth.fail(); });
                if(this.isRoot) this.adm();
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },
            send() {
                const now = Date.now();
                let t = document.getElementById('msg-input').value.trim();
                if(!t || now - this.last < 3000) return;
                this.last = now;
                firebase.database().ref("chat").push({ u: this.user, t: t, r: this.isRoot });
                document.getElementById('msg-input').value = "";
                const b = document.getElementById('send-btn'); b.disabled = true;
                setTimeout(() => b.disabled = false, 3000);
            },
            draw(k, d) {
                const f = document.getElementById('feed'), r = document.createElement('div');
                r.id = k; r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                let b = d.r ? `<span class="founder-badge">FOUNDER</span>` : "";
                
                let tools = "";
                if (this.isRoot) {
                    tools = `<div class="admin-tools">
                        <svg onclick="Core.db.ref('chat/${k}').remove()" class="adm-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        ${d.u !== this.user ? `<svg onclick="Core.ban('${d.u}')" class="adm-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>` : ''}
                    </div>`;
                }

                r.innerHTML = `<div class="meta">${b} ${d.u} ${tools}</div><div class="bubble"></div>`;
                r.querySelector('.bubble').textContent = d.t;
                f.appendChild(r); f.scrollTop = f.scrollHeight;
            },
            ban(u) { if(confirm("BAN "+u+"?")) firebase.database().ref("banned/"+u).set(true); },
            adm() { 
                document.getElementById('admin-zone').style.display = 'block'; 
                this.db.ref("banned").on('value', s => { 
                    const l = document.getElementById('ban-list'); l.innerHTML = ""; 
                    if(s.val()) Object.keys(s.val()).forEach(k => { 
                        l.innerHTML += `<div class="ban-item">${k} <span onclick="Core.ub('${k}')" style="color:#fff; cursor:pointer; background:#111; padding:2px 6px; border-radius:4px;">UNBAN</span></div>`; 
                    }); 
                }); 
            },
            ub(u) { if(confirm("Unban?")) this.db.ref("banned/" + u).remove(); },
            toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); },
            logout() { localStorage.clear(); location.reload(); }
        };
        Auth.init();
    </script>
</body>
</html>
