<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- INDUSTRIAL GLOBAL STYLE --- */
        :root {
            --bg: #050505;
            --surface: #111111;
            --text-main: #ffffff;
            --text-dim: #666666;
            --accent: #ffffff; /* Строгий белый акцент */
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --danger: #ff3b30;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; height: 100vh;
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #app-root {
            width: 100%; max-width: 600px; height: 100%;
            display: flex; flex-direction: column;
            background: var(--bg);
            position: relative;
        }

        /* --- ЭКРАН ВХОДА --- */
        #auth-layer {
            position: absolute; inset: 0;
            background: var(--bg);
            z-index: 999;
            display: flex; flex-direction: column;
            justify-content: center; padding: 40px;
            transition: transform 0.6s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .brand-title {
            font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
            margin-bottom: 40px; text-transform: uppercase;
        }

        .input-global {
            background: var(--surface); border: var(--border);
            color: white; padding: 16px; border-radius: 8px;
            font-size: 16px; margin-bottom: 15px;
            transition: 0.2s;
        }
        .input-global:focus { border-color: var(--accent); }

        .btn-primary {
            background: var(--accent); color: black; border: none;
            padding: 16px; border-radius: 8px; font-weight: 600;
            font-size: 14px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* --- ИНТЕРФЕЙС ЧАТА --- */
        header {
            padding: 20px; border-bottom: var(--border);
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .status-badge {
            font-size: 10px; font-weight: 600;
            padding: 4px 8px; border-radius: 4px;
            background: #222; color: #888;
        }
        .status-badge.online { color: #32d74b; background: rgba(50, 215, 75, 0.1); }

        #chat-feed {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .msg-row { display: flex; flex-direction: column; max-width: 85%; }
        .msg-row.mine { align-self: flex-end; align-items: flex-end; }

        .sender-name {
            font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
            margin-left: 12px;
        }
        .msg-row.mine .sender-name { margin-right: 12px; margin-left: 0; }

        .bubble {
            padding: 12px 16px; border-radius: 18px;
            background: var(--surface); border: var(--border);
            font-size: 15px; line-height: 1.5; word-wrap: break-word;
            position: relative;
        }
        
        .msg-row.mine .bubble {
            background: #1a1a1a;
            border-color: #333;
            border-bottom-right-radius: 4px;
        }
        .msg-row:not(.mine) .bubble {
            border-bottom-left-radius: 4px;
        }

        /* ADMIN HIGHLIGHT */
        .msg-row.admin .bubble {
            border: 1px solid white;
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }
        .msg-row.admin .sender-name { color: white; font-weight: bold; }

        /* ПАНЕЛЬ ВВОДА */
        .input-area {
            padding: 15px; border-top: var(--border);
            background: var(--bg);
            display: flex; gap: 10px;
        }

        .del-btn {
            color: var(--danger); font-size: 10px; font-weight: bold;
            margin-left: 8px; cursor: pointer; text-decoration: none;
        }

        /* СКРОЛЛБАР */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app-root">
        <div id="auth-layer">
            <div class="brand-title">Resonance</div>
            <p style="color: #666; font-size: 13px; margin-bottom: 30px;">Global Secure Connection</p>
            
            <input type="text" id="nick-field" class="input-global" placeholder="Ваш псевдоним" maxlength="20">
            <input type="password" id="pass-field" class="input-global" placeholder="Root Password" style="display:none">
            
            <button class="btn-primary" onclick="App.login()">Войти в сеть</button>
        </div>

        <header>
            <div style="font-weight: 600; letter-spacing: -0.5px;">RESONANCE</div>
            <div id="connection-status" class="status-badge">CONNECTING...</div>
        </header>

        <div id="chat-feed"></div>

        <div class="input-area">
            <input type="text" id="message-input" class="input-global" style="margin:0; flex:1;" placeholder="Сообщение...">
            <button class="btn-primary" style="padding: 0 20px;" onclick="App.send()">→</button>
        </div>
    </div>

    <script>
        /**
         * RESONANCE GLOBAL CORE v10.0
         * Разработчик: Workstation5495
         */

        const CONFIG = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com",
            projectId: "resonance-chat-5495",
            adminNick: "Workstation5495",
            adminPass: "5495" // <--- ТВОЙ ПАРОЛЬ (МОЖЕШЬ ПОМЕНЯТЬ)
        };

        const App = {
            db: null,
            user: null,
            isRoot: false,

            init() {
                // Инициализация базы
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();

                // Проверка сохраненного входа (Авто-вход)
                const savedUser = localStorage.getItem('resonance_user');
                const savedRoot = localStorage.getItem('resonance_root');

                if (savedUser) {
                    this.user = savedUser;
                    if(savedRoot === 'true') this.isRoot = true;
                    this.enterChat();
                }

                // Слушатели событий
                document.getElementById('nick-field').addEventListener('input', (e) => {
                    const isAdm = e.target.value === CONFIG.adminNick;
                    document.getElementById('pass-field').style.display = isAdm ? 'block' : 'none';
                });

                document.getElementById('message-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.send();
                });
            },

            login() {
                const nick = document.getElementById('nick-field').value.trim();
                if (!nick) return alert("Введите имя!");

                // Проверка Админа
                if (nick === CONFIG.adminNick) {
                    const pass = document.getElementById('pass-field').value;
                    if (pass === CONFIG.adminPass) {
                        this.isRoot = true;
                        localStorage.setItem('resonance_root', 'true');
                    } else {
                        return alert("Неверный пароль администратора!");
                    }
                }

                // Сохранение данных
                this.user = nick;
                localStorage.setItem('resonance_user', nick);
                this.enterChat();
            },

            enterChat() {
                // Анимация входа
                document.getElementById('auth-layer').style.transform = "translateY(-100%)";
                
                // Обновление статуса
                const status = document.getElementById('connection-status');
                status.innerText = "ONLINE";
                status.classList.add("online");

                // Запуск прослушки сообщений
                this.listen();
            },

            send() {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (!text) return;

                this.db.ref("global_chat").push({
                    u: this.user,
                    t: this.escapeHtml(text), // Защита от взлома
                    r: this.isRoot, // Флаг админа
                    ts: Date.now()
                });

                input.value = "";
            },

            listen() {
                this.db.ref("global_chat").limitToLast(100).on("child_added", (snapshot) => {
                    const data = snapshot.val();
                    const key = snapshot.key;
                    this.renderMessage(key, data);
                });

                this.db.ref("global_chat").on("child_removed", (snapshot) => {
                    const el = document.getElementById(snapshot.key);
                    if(el) el.remove();
                });
            },

            renderMessage(key, data) {
                const feed = document.getElementById('chat-feed');
                const isMe = data.u === this.user;
                
                const div = document.createElement('div');
                div.id = key;
                div.className = `msg-row ${isMe ? 'mine' : ''} ${data.r ? 'admin' : ''}`;

                // Кнопка удаления (только для Админа)
                const deleteBtn = this.isRoot ? `<span class="del-btn" onclick="App.deleteMsg('${key}')">УДАЛИТЬ</span>` : '';

                div.innerHTML = `
                    <div class="sender-name">${data.u} ${deleteBtn}</div>
                    <div class="bubble">${data.t}</div>
                `;

                feed.appendChild(div);
                feed.scrollTop = feed.scrollHeight; // Авто-скролл вниз
            },

            deleteMsg(key) {
                if(confirm("Удалить это сообщение для всех?")) {
                    this.db.ref("global_chat").child(key).remove();
                }
            },

            // Защита текста (чтобы нельзя было сломать чат скриптом)
            escapeHtml(text) {
                if (!text) return text;
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        };

        // Запуск
        App.init();
    </script>
</body>
</html>
