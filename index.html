<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- INDUSTRIAL PRIME THEME --- */
        :root {
            --bg: #030303;
            --surface: #0f0f0f;
            --card: #0a0a0a;
            --text: #ffffff;
            --text-dim: #666666;
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --danger: #ff453a;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* --- RESPONSIVE APP CONTAINER --- */
        #app-core {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background: var(--card);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 600px) {
            #app-core {
                max-width: 420px; height: 90vh;
                border: var(--border); border-radius: 24px;
                box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            }
        }

        /* --- AUTH LAYER (LOGIN) --- */
        #auth-gate {
            position: absolute; inset: 0;
            background: var(--card);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; padding: 40px;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .brand-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
            margin-bottom: 8px; background: linear-gradient(to right, #fff, #777);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .brand-sub {
            font-size: 11px; color: var(--text-dim); margin-bottom: 40px;
            letter-spacing: 3px; text-transform: uppercase;
        }

        .input-std {
            background: var(--surface); border: var(--border);
            color: white; padding: 18px; border-radius: 14px;
            font-size: 16px; margin-bottom: 15px; font-family: 'Inter', sans-serif;
            transition: 0.3s;
        }
        .input-std:focus { border-color: var(--accent); transform: scale(1.01); }

        .btn-main {
            background: var(--accent); color: black; border: none;
            padding: 18px; border-radius: 14px; font-weight: 700;
            font-size: 14px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.2s; font-family: 'Outfit', sans-serif;
        }
        .btn-main:hover { opacity: 0.9; }

        /* --- CHAT HEADER --- */
        header {
            padding: 18px 25px; border-bottom: var(--border);
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .header-title h1 { margin: 0; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; }
        .header-title p { margin: 0; font-size: 9px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }

        .status-led {
            width: 6px; height: 6px; background: #32d74b;
            border-radius: 50%; box-shadow: 0 0 10px #32d74b;
            opacity: 0; transition: 0.5s;
        }
        .status-led.online { opacity: 1; }

        /* --- FEED --- */
        #feed {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 14px;
        }

        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: fadeUp 0.3s ease; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }

        .meta { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; padding: 0 6px; }

        .bubble {
            padding: 12px 18px; border-radius: 20px;
            background: var(--surface); border: 1px solid rgba(255,255,255,0.05);
            font-size: 15px; line-height: 1.45;
        }
        
        .msg-wrap.mine .bubble {
            background: #ffffff; color: #000;
            border-bottom-right-radius: 4px;
        }
        .msg-wrap:not(.mine) .bubble {
            border-bottom-left-radius: 4px;
        }

        /* Admin Special Style */
        .msg-wrap.admin .bubble {
            background: #111; border: 1px solid #fff; color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .msg-wrap.admin .meta { color: #fff; font-weight: bold; }

        /* --- FOOTER --- */
        .footer {
            padding: 15px; border-top: var(--border);
            background: var(--card); display: flex; gap: 10px; align-items: center;
        }

        .input-msg {
            flex: 1; background: var(--surface); border: none;
            padding: 14px 20px; border-radius: 30px; color: white;
            font-size: 15px;
        }
        
        .send-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--accent); color: black; border: none;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }

        .drop-link { color: var(--danger); margin-left: 8px; font-weight: 700; cursor: pointer; font-size: 9px; text-decoration: none; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 0px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app-core">
        <div id="auth-gate">
            <div class="brand-logo">RESONANCE CHAT</div>
            <div class="brand-sub">GLOBAL CONNECTION</div>
            
            <input type="text" id="nick-field" class="input-std" placeholder="Identity (Nickname)" maxlength="15">
            <input type="password" id="pass-field" class="input-std" placeholder="Secure Token" style="display:none">
            
            <button class="btn-main" onclick="Core.login()">Connect</button>
        </div>

        <header>
            <div class="header-title">
                <h1>RESONANCE CHAT</h1>
                <p>Always on Touch</p>
            </div>
            <div id="status-led" class="status-led"></div>
        </header>

        <div id="feed"></div>

        <div class="footer">
            <input type="text" id="msg-input" class="input-msg" placeholder="Broadcast message...">
            <button class="send-btn" onclick="Core.send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <script>
        /**
         * RESONANCE CORE [ULTIMATE]
         * Security: Obfuscated Keys + Base64 Auth
         */

        // Скрываем ключи от простых ботов
        const _k = ["BOPE0sictEq_0Ui_1", "jjpvdeN2PSOfnQ-U2", "oNWAKtZFHbsIoHXHx", "MiO6bXoGSI4XZcWu", "YTPrrurqL793BJ-OqncA"];
        const _d = "resonance-chat-5495";

        const CONFIG = {
            apiKey: _k.join(""), // Собираем ключ
            databaseURL: `https://${_d}-default-rtdb.firebaseio.com`,
            projectId: _d,
            admin: "Workstation5495",
            hash: "NTQ5NQ==" // Base64 для "5495"
        };

        const Core = {
            db: null, user: null, isRoot: false,

            init() {
                firebase.initializeApp(CONFIG);
                this.db = firebase.database();

                // Авто-вход
                const saved = localStorage.getItem('res_core_user');
                if (saved) {
                    this.user = saved;
                    this.isRoot = localStorage.getItem('res_core_root') === 'true';
                    this.open();
                }

                // Логика поля пароля
                document.getElementById('nick-field').oninput = (e) => {
                    document.getElementById('pass-field').style.display = 
                        (e.target.value === CONFIG.admin) ? 'block' : 'none';
                };
                
                document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') this.send(); };
            },

            login() {
                const nick = document.getElementById('nick-field').value.trim();
                if (!nick) return;

                if (nick === CONFIG.admin) {
                    const pass = document.getElementById('pass-field').value;
                    if (btoa(pass) === CONFIG.hash) {
                        this.isRoot = true;
                        localStorage.setItem('res_core_root', 'true');
                    } else { return alert("ACCESS DENIED: INVALID TOKEN"); }
                }

                this.user = nick;
                localStorage.setItem('res_core_user', nick);
                this.open();
            },

            open() {
                document.getElementById('auth-gate').style.transform = "translateY(-100%)";
                setTimeout(() => document.getElementById('status-led').classList.add('online'), 500);
                this.sync();
            },

            send() {
                const inp = document.getElementById('msg-input');
                const val = inp.value.trim();
                if (!val) return;

                this.db.ref("global_chat").push({
                    u: this.user,
                    t: val.replace(/</g, "&lt;"), // Anti-XSS
                    r: this.isRoot,
                    ts: Date.now()
                });
                inp.value = "";
            },

            sync() {
                this.db.ref("global_chat").limitToLast(100).on("child_added", (s) => {
                    const d = s.val();
                    const feed = document.getElementById('feed');
                    const isMe = d.u === this.user;
                    
                    const row = document.createElement('div');
                    row.id = s.key;
                    row.className = `msg-wrap ${isMe ? 'mine' : ''} ${d.r ? 'admin' : ''}`;

                    const del = (this.isRoot) ? `<span class="drop-link" onclick="Core.drop('${s.key}')">DROP</span>` : '';

                    row.innerHTML = `
                        <div class="meta">${d.u} ${del}</div>
                        <div class="bubble">${d.t}</div>
                    `;
                    
                    feed.appendChild(row);
                    feed.scrollTop = feed.scrollHeight;
                });
                
                this.db.ref("global_chat").on("child_removed", (s) => {
                    const el = document.getElementById(s.key);
                    if(el) el.remove();
                });
            },

            drop(k) { if(confirm("CONFIRM DELETE?")) this.db.ref("global_chat").child(k).remove(); }
        };

        Core.init();
    </script>
</body>
</html>
