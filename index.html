<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --border: 1px solid rgba(255,255,255,0.1); --danger: #ff453a; --success: #32d74b; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { height: 100dvh; background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; display: none; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 95vh; border: var(--border); border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); } }

        /* AUTH GATE */
        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .auth-step { display: none; width: 100%; animation: popIn 0.3s ease; }
        .auth-step.active { display: block !important; }
        .auth-inp { background: #111; border: 1px solid #222; color: #fff; padding: 20px; border-radius: 16px; margin-bottom: 12px; width: 100%; text-align: center; font-size: 16px; }
        .auth-btn { background: #fff; color: #000; border: none; padding: 20px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; }

        /* UI */
        header { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #161616; background: rgba(10,10,10,0.98); }
        .brand { font-family: 'Outfit'; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
        #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; background: #080808; border-right: 1px solid #222; z-index: 500; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 30px; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); box-shadow: 100px 0 200px rgba(0,0,0,0.9); }
        #admin-zone { display: none; padding: 15px; border: 1px solid rgba(255, 69, 58, 0.2); border-radius: 16px; background: rgba(255,69,58,0.02); margin-bottom: 20px; }

        /* FEED & GLOW */
        #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; animation: slideIn 0.3s ease; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 14px 18px; font-size: 15px; border-radius: 22px; line-height: 1.4; background: #1a1a1a; word-wrap: break-word; }
        .mine .bubble { background: #fff; color: #000; }
        .founder-badge { background: linear-gradient(90deg, #ff453a, #ff9f0a); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 900; box-shadow: 0 0 15px rgba(255, 69, 58, 0.4); animation: pulseGlow 2s infinite; }
        
        .admin-tools { display: flex; gap: 8px; opacity: 0.4; transition: 0.2s; }
        .adm-icon { width: 14px; height: 14px; cursor: pointer; color: var(--danger); fill: none; stroke: currentColor; stroke-width: 2; }

        .footer { height: 80px; padding: 0 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #161616; background: #0a0a0a; }
        .msg-input { flex: 1; background: #111; border: 1px solid #222; padding: 0 20px; border-radius: 25px; color: #fff; height: 50px; }
        .send-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        @keyframes pulseGlow { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 20px rgba(255, 69, 58, 0.6); } 100% { opacity: 0.8; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } }
        ::-webkit-scrollbar { width: 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="auth-gate">
        <h1 style="font-family:'Outfit'; font-size:42px; text-align:center; margin-bottom:40px;">RESONANCE</h1>
        <div id="st-1" class="auth-step active"><input type="text" id="n-f" class="auth-inp" placeholder="Identity Name"><button onclick="Auth.check()" class="auth-btn">VERIFY</button></div>
        <div id="st-l" class="auth-step"><input type="password" id="l-p" class="auth-inp" placeholder="Password"><button onclick="Auth.login()" class="auth-btn">LINK SYSTEM</button></div>
        <div id="st-r" class="auth-step"><input type="password" id="r-p1" class="auth-inp" placeholder="Create Pass (8+)"><input type="password" id="r-p2" class="auth-inp" placeholder="Confirm Pass"><button onclick="Auth.reg()" class="auth-btn">INITIALIZE</button></div>
    </div>

    <div id="app-core">
        <div id="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;"><div style="font-family:'Outfit'; font-size:20px; font-weight:800;">MENU</div><button onclick="Core.toggleMenu()" style="background:none; border:none; color:#444; font-size:28px;">&times;</button></div>
            <div id="admin-zone"><div id="ban-list"></div></div>
            <button onclick="Core.logout()" style="margin-top:auto; background:rgba(255,69,58,0.1); color:var(--danger); border:none; padding:15px; border-radius:12px; font-weight:700; cursor:pointer;">DISCONNECT</button>
        </div>
        <header><button onclick="Core.toggleMenu()" style="background:none; border:none; color:#fff; cursor:pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button><div class="brand">RESONANCE</div><div style="width:8px; height:8px; background:#32d74b; border-radius:50%;"></div></header>
        <div id="feed"></div>
        <div class="footer"><input type="text" id="msg-input" class="msg-input" placeholder="Broadcast..."><button onclick="Core.send()" class="send-btn">▲</button></div>
    </div>

    <script>
        const DEV_ID = btoa(navigator.userAgent + navigator.language).substring(0, 16);
        const CFG = { k: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk", d: "https://resonance---chat-default-rtdb.firebaseio.com", a: "Workstation5495", h: "UlRXNTQ5NUpFTExZQkVBTg==" };

        const Auth = {
            t: null,
            init() { 
                firebase.initializeApp({apiKey: CFG.k, databaseURL: CFG.d}); 
                const u = localStorage.getItem('res_user');
                if(u) {
                    firebase.database().ref("users/"+u).once('value', s => {
                        const d = s.val();
                        if(u === CFG.a && d && d.dev && d.dev !== DEV_ID) { this.fail(); return; }
                        this.fin(u, localStorage.getItem('res_root') === 'true');
                    });
                }
            },
            check() {
                const n = document.getElementById('n-f').value.trim(); if(n.length<3) return;
                this.t = n;
                firebase.database().ref('users/'+n).once('value', s => {
                    document.querySelectorAll('.auth-step').forEach(e => e.classList.remove('active'));
                    if (s.exists()) document.getElementById('st-l').classList.add('active'); else document.getElementById('st-r').classList.add('active');
                });
            },
            login() {
                const p = document.getElementById('l-p').value;
                firebase.database().ref('users/'+this.t).once('value', s => {
                    const d = s.val();
                    if (this.t === CFG.a) {
                        if (btoa(p) === CFG.h) {
                            if (!d.dev) firebase.database().ref('users/'+this.t).update({dev: DEV_ID});
                            else if (d.dev !== DEV_ID) return alert("HARDWARE MISMATCH");
                            this.fin(this.t, true);
                        } else alert("WRONG");
                    } else if (d && d.pass === btoa(p)) this.fin(this.t, false); else alert("WRONG");
                });
            },
            reg() {
                const p1 = document.getElementById('r-p1').value, p2 = document.getElementById('r-p2').value;
                if (p1 !== p2 || p1.length < 8) return alert("CHECK PASSWORDS");
                firebase.database().ref('users/'+this.t).set({ pass: btoa(p1), ts: Date.now() }).then(() => this.fin(this.t, false));
            },
            fin(n, r) { localStorage.setItem('res_user', n); localStorage.setItem('res_root', r); Core.user = n; Core.isRoot = r; this.ok(); },
            ok() { document.getElementById('auth-gate').style.display = "none"; document.getElementById('app-core').style.display = "flex"; Core.run(); },
            fail() { localStorage.clear(); location.reload(); }
        };

        const Core = {
            run() {
                this.db = firebase.database();
                this.db.ref("chat").limitToLast(50).on("child_added", s => this.draw(s.key, s.val()));
                this.db.ref("chat").on("child_removed", s => document.getElementById(s.key)?.remove());
                firebase.database().ref("banned/"+this.user).on('value', s => { if(s.exists()) Auth.fail(); });
                if(this.isRoot) document.getElementById('admin-zone').style.display = 'block';
            },
            send() {
                let t = document.getElementById('msg-input').value.trim(); if(!t) return;
                this.db.ref("chat").push({ u: this.user, t: t, r: this.isRoot });
                document.getElementById('msg-input').value = "";
            },
            draw(k, d) {
                const f = document.getElementById('feed'), r = document.createElement('div');
                r.id = k; r.className = `msg-wrap ${d.u === this.user ? 'mine' : ''}`;
                let b = d.r ? `<span class="founder-badge">FOUNDER</span>` : "";
                let tools = (this.isRoot) ? `<div class="admin-tools">
                    <svg onclick="Core.db.ref('chat/${k}').remove()" class="adm-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    ${d.u !== this.user ? `<svg onclick="Core.ban('${d.u}')" class="adm-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>` : ''}
                </div>` : "";
                r.innerHTML = `<div class="meta">${b} ${d.u} ${tools}</div><div class="bubble"></div>`;
                r.querySelector('.bubble').textContent = d.t;
                f.appendChild(r); f.scrollTop = f.scrollHeight;
            },
            ban(u) { if(confirm("BAN "+u+"?")) firebase.database().ref("banned/"+u).set(true); },
            toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); },
            logout() { localStorage.clear(); location.reload(); }
        };
        Auth.init();
    </script>
</body>
</html>
