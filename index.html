<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Chat — Always on Touch</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <h1>RESONANCE</h1>
        <p class="tagline">Always on Touch</p>
    </header>

    <div id="chat-container" class="glass-panel">
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="username" placeholder="Nickname" value="Workstation5495">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendBtn" class="glossy-btn">Send</button>
        </div>
    </div>

    <script>
        // ТВОЙ КОНФИГ С КЛЮЧОМ
        const firebaseConfig = {
            apiKey: "BOPE0sictEq_0Ui_1jjpvdeN2PSOfnQ-U2oNWAKtZFHbsIoHXHxMiO6bXoGSI4XZcWuYTPrrurqL793BJ-OqncA",
            authDomain: "resonance-chat-5495.firebaseapp.com",
            databaseURL: "https://resonance-chat-5495-default-rtdb.firebaseio.com", // ПРОВЕРЬ ЭТУ ССЫЛКУ В FIREBASE!
            projectId: "resonance-chat-5495",
            storageBucket: "resonance-chat-5495.appspot.com",
            messagingSenderId: "909712050521",
            appId: "1:909712050521:web:your_app_id"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const msgInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');

        // Функция отправки
        function sendMessage() {
            const name = usernameInput.value || "Workstation5495";
            const text = msgInput.value;
            if (text.trim() !== "") {
                db.ref("global_chat").push({
                    name: name,
                    text: text,
                    timestamp: Date.now()
                });
                msgInput.value = "";
            }
        }

        sendBtn.onclick = sendMessage;
        msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage() };

        // Слушатель чата
        db.ref("global_chat").on("child_added", (snapshot) => {
            const data = snapshot.val();
            const messageElement = document.createElement("div");
            messageElement.className = "message-item";
            messageElement.innerHTML = `<strong>${data.name}</strong><p>${data.text}</p>`;
            messagesDiv.appendChild(messageElement);
            
            // Скролл вниз при новом сообщении
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    </script>

    <footer style="margin-top: 20px; opacity: 0.4; font-size: 11px; text-align: center;">
        Created by Workstation5495 &copy; 2026
    </footer>

</body>
</html>
