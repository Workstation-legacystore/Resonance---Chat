<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESONANCE | GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --text: #fff; --danger: #ff453a; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { height: 100dvh; background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #app-core { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--card); position: relative; overflow: hidden; display: none; }
        @media (min-width: 600px) { #app-core { max-width: 420px; height: 95vh; border: 1px solid #222; border-radius: 20px; } }

        #auth-gate { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 40px; }
        .auth-inp { background: #111; border: 1px solid #222; color: #fff; padding: 18px; border-radius: 12px; margin-bottom: 12px; width: 100%; text-align: center; font-size: 16px; }
        .auth-btn { background: #fff; color: #000; border: none; padding: 18px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; }
        .hidden { display: none !important; }

        header { height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #111; }
        #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px 16px; font-size: 15px; border-radius: 18px; background: #161616; color: #fff; }
        .mine .bubble { background: #fff; color: #000; }
        .footer { height: 70px; padding: 0 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #111; }
        .msg-input { flex: 1; background: #111; border: none; padding: 0 15px; border-radius: 20px; color: #fff; height: 44px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="auth-gate">
        <h1 style="font-family:'Outfit'; font-size:42px; text-align:center; margin-bottom:40px; letter-spacing:-2px;">RESONANCE</h1>
        <div id="step-1">
            <input type="text" id="nick-field" class="auth-inp" placeholder="Nickname">
            <button onclick="Auth.check()" class="auth-btn">PROCEED</button>
        </div>
        <div id="step-login" class="hidden">
            <input type="password" id="login-pass" class="auth-inp" placeholder="Password">
            <button onclick="Auth.login()" class="auth-btn">LOGIN</button>
        </div>
        <div id="step-register" class="hidden">
            <input type="password" id="reg-pass" class="auth-inp" placeholder="Create Password">
            <button onclick="Auth.register()" class="auth-btn">CREATE</button>
        </div>
    </div>

    <div id="app-core">
        <header><div style="font-family:'Outfit'; font-weight:800;">RESONANCE GLOBAL</div></header>
        <div id="feed"></div>
        <div class="footer">
            <input type="text" id="msg-input" class="msg-input" placeholder="...">
            <button onclick="Core.send()" style="width:44px; height:44px; border-radius:50%; background:#fff; border:none; cursor:pointer;">▲</button>
        </div>
    </div>

    <script>
        const CFG = { k: "AIzaSyAmZnFT9sYDL7XFnbKqupwBIPC4zsoyIrk", d: "https://resonance---chat-default-rtdb.firebaseio.com", a: "Workstation5495", h: "UlRXNTQ5NUpFTExZQkVBTg==" };
        
        const Auth = {
            nick: null,
            init() { 
                firebase.initializeApp({apiKey: CFG.k, databaseURL: CFG.d}); 
                if(localStorage.getItem('res_user')) this.fin(localStorage.getItem('res_user'), localStorage.getItem('res_root') === 'true');
            },
            check() {
                const n = document.getElementById('nick-field').value.trim();
                if (n.length < 2) return;
                this.nick = n;
                // ЕСЛИ ТЫ АДМИН - СРАЗУ НА ВХОД
                if (n === CFG.a) {
                    this.show('step-login');
                    return;
                }
                firebase.database().ref('users/' + n).once('value', s => {
                    if (s.exists()) this.show('step-login');
                    else this.show('step-register');
                });
            },
            show(id) {
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-login').classList.add('hidden');
                document.getElementById('step-register').classList.add('hidden');
                document.getElementById(id).classList.remove('hidden');
            },
            login() {
                const p = document.getElementById('login-pass').value;
                if (this.nick === CFG.a && btoa(p) === CFG.h) return this.fin(this.nick, true);
                firebase.database().ref('users/' + this.nick).once('value', s => {
                    if (s.val() && s.val().pass === btoa(p)) this.fin(this.nick, false);
                    else alert("Wrong Pass");
                });
            },
            register() {
                const p = document.getElementById('reg-pass').value;
                if (p.length < 4) return alert("Too short");
                firebase.database().ref('users/' + this.nick).set({ pass: btoa(p) }).then(() => this.fin(this.nick, false));
            },
            fin(n, r) {
                localStorage.setItem('res_user', n); localStorage.setItem('res_root', r);
                Core.user = n; Core.isRoot = r;
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app-core').style.display = 'flex';
                Core.start();
            }
        };

        const Core = {
            start() {
                this.db = firebase.database();
                this.db.ref("chat").limitToLast(50).on("child_added", s => {
                    const d = s.val();
                    const f = document.getElementById('feed');
                    const r = document.createElement('div');
                    r.style.display = 'flex'; r.style.flexDirection = 'column';
                    if (d.u === this.user) r.style.alignItems = 'flex-end';
                    r.innerHTML = `<div style="font-size:9px; color:#444;">${d.u}</div><div class="bubble">${d.t}</div>`;
                    f.appendChild(r); f.scrollTop = f.scrollHeight;
                });
            },
            send() {
                let t = document.getElementById('msg-input').value.trim(); if(!t) return;
                this.db.ref("chat").push({ u: this.user, t: t, ts: Date.now() });
                document.getElementById('msg-input').value = "";
            }
        };
        Auth.init();
    </script>
</body>
</html>
